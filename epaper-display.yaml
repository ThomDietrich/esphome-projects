# esphome -s device_name epaper-display-oben -s device_friendly_name "ePaper Display oben" -s device_area "kitchen" run epaper-display.yaml
# esphome -s device_name epaper-display-unten -s device_friendly_name "ePaper Display unten" -s device_area "Untere Etage" run epaper-display.yaml

substitutions:
  device_name: epaper-display-default
  device_friendly_name: ePaper Display Default
  device_area: default

  status_led_pin: GPIO27

# Project based on https://github.com/maxmacstn/HA-ePaper-Display

esphome:
  name: ${device_name}
  friendly_name: ${device_friendly_name}
  area: ${device_area}

# Lokaler Custom-Treiber fuer das originale Waveshare 4.2" B (UC8176) Tri-Color-Panel.
# Das eingebaute 4.20in-bV2-bwr (UC8179/V2) steuert nur die halbe Flaeche an (Issue #5369).
external_components:
  - source:
      type: local
      path: components
    components: [waveshare_uc8176_bwr]

packages:
  - !include system/stamp_pico.yaml
  - !include common/wifi.yaml
  - !include common/boilerplate.yaml
  - !include include/on_board_status_led_sk6812.yaml
  - !include include/epaper_display_fonts.yaml
  - !include include/epaper_display_homeassistant.yaml
  - !include include/epaper_display_screen.yaml

sensor:
  - platform: template
    name: Last Content Update
    device_class: timestamp
    id: epaperdisplay_last_update

button:
  # Kurze Auffrischung: zeichnet den aktuellen Inhalt neu, auch wenn er unveraendert
  # ist (unveraenderte Bilder ueberspringt der Treiber sonst). Mono-Refresh (2-4 s);
  # ist Rot im Bild oder noch auf dem Panel, automatisch Tri-Color.
  - platform: template
    name: Auffrischung (kurz)
    icon: mdi:refresh
    entity_category: config
    on_press:
      - lambda: 'id(epaperdisplay).request_redraw();'
      - component.update: epaperdisplay

  # Volle Auffrischung: erzwingt den vollen Tri-Color-OTP-Refresh (lange Waveform,
  # ~26s) auch ohne Rot — frischt das ganze Panel auf (heller/weisserer Hintergrund).
  - platform: template
    name: Auffrischung (voll)
    icon: mdi:image-refresh
    entity_category: config
    on_press:
      - lambda: 'id(epaperdisplay).request_full_refresh();'
      - component.update: epaperdisplay
