substitutions:
  device_name: torfahrtsschuppen-raumsensor
  device_friendly_name: Torfahrtsschuppen Raumsensor
  device_area: Torfahrtsschuppen

  status_led_pin: GPIO8
  on_board_button_pin: GPIO9

  buzzer_pin: GPIO4


esphome:
  name: ${device_name}
  friendly_name: ${device_friendly_name}
  area: ${device_area}

packages:
  - !include system/esp32_c3_supermini.yaml
  - !include common/wifi.yaml
  - !include common/boilerplate.yaml
  - !include include/on_board_status_led_single.yaml
  - !include include/buzzer_rtttl.yaml

light:
  - id: !extend on_board_led
    pin:
      ignore_strapping_warning: true

i2c:
  id: i2c_component
  sda:
    number: GPIO2
    ignore_strapping_warning: true
  scl: GPIO3
  scan: true
  frequency: 50kHz


sensor:
  # https://esphome.io/components/sensor/bme280.html
  - platform: bme280_i2c
    temperature:
      name: Technikraum Temperatur
      id: technikraum_temp
      oversampling: 16x
    humidity:
      name: Technikraum Luftfeuchte
      id: technikraum_hum
    pressure:
      name: Technikraum Luftdruck
      accuracy_decimals: 0
    address: 0x76
    update_interval: 60s

  - platform: absolute_humidity
    name: Technikraum Luftfeuchte, absolut
    id: technikraum_hum_abs
    temperature: technikraum_temp
    humidity: technikraum_hum

  - platform: dew_point
    name: Technikraum Taupunkt
    id: technikraum_dewpoint
    temperature: technikraum_temp
    humidity: technikraum_hum

  - platform: bme280_i2c
    temperature:
      name: Dachboden Temperatur
      id: dachboden_temp
      oversampling: 16x
    humidity:
      name: Dachboden Luftfeuchte
      id: dachboden_hum
    pressure:
      name: Dachboden Luftdruck
      accuracy_decimals: 0
    address: 0x77  # Ungewöhnlicher BME280 mit SDO auf VCC
    update_interval: 60s

  - platform: absolute_humidity
    name: Dachboden Luftfeuchte, absolut
    id: dachboden_hum_abs
    temperature: dachboden_temp
    humidity: dachboden_hum

  - platform: dew_point
    name: Dachboden Taupunkt
    id: dachboden_dewpoint
    temperature: dachboden_temp
    humidity: dachboden_hum


binary_sensor:
  - platform: gpio
    name: On-board Button
    id: button_onboard
    pin:
      number: ${on_board_button_pin}
      mode:
        input: true
        pullup: true
      inverted: true
      ignore_strapping_warning: true
    internal: true
    filters:
      - delayed_on: 50ms
    on_press:
      - button.press: esp_restart_button


switch:
  # Construct an additional GND from GPIO
  - platform: gpio
    internal: true
    restore_mode: ALWAYS_ON
    name: Additional GND Pin 0
    icon: mdi:arrow-collapse-down
    pin:
      number: GPIO0
      inverted: true
      mode:
        output: true
        open_drain: true
