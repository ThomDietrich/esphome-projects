# ======================================================================================================================
# Flusserkennung — Heizkreis und Warmwasser
# ======================================================================================================================
# Erkennt anhand der Impulszaehler-Ticks, ob in Heizkreis bzw. Warmwasserkreis aktuell Wasser fliesst.
# Dreistufige Logik:
#
#   1. intern_*_waerme_tick:  Roh-Impulse vom Zenner-Zaehler (aus Template)
#   2. intern_*_aktiv:  Totmannschalter (delayed_off: 60s). Wird bei jedem Tick auf ON gesetzt und faellt 60s nach dem
#      letzten Tick auf OFF zurueck.
#   3. sensor_*_aktiv:  Veroeffentlichter Sensor fuer Home Assistant. Folgt dem Totmannschalter, wird aber zusaetzlich
#      sofort auf OFF gesetzt, wenn wwb_anforderung umschaltet — denn ein Moduswechsel bedeutet sofortigen
#      Durchflussstopp im jeweils anderen Kreis.
#
# Hinweis: Umschalten der WWB-Anforderung bedeutet nicht automatisch, dass im neuen Kreis auch Wasser fliesst
# (insbesondere im Heizkreis).
# ======================================================================================================================

binary_sensor:
  - id: !extend intern_heizkreis_waerme_tick
    on_press:
      - binary_sensor.template.publish:
          id: intern_heizkreis_aktiv
          state: ON
    on_release:
      - binary_sensor.template.publish:
          id: intern_heizkreis_aktiv
          state: OFF

  - id: !extend intern_wwb_waerme_tick
    on_press:
      - binary_sensor.template.publish:
          id: intern_wwb_aktiv
          state: ON
    on_release:
      - binary_sensor.template.publish:
          id: intern_wwb_aktiv
          state: OFF

  # https://esphome.io/components/binary_sensor/template.html
  - platform: template
    name: Flusserkennung (Zwischenschritt)
    id: intern_heizkreis_aktiv
    internal: true
    icon: mdi:heart-pulse
    lambda: 'return false;'
    filters:
      - delayed_off: 60s

  - platform: template
    name: Flusserkennung (Zwischenschritt)
    id: intern_wwb_aktiv
    internal: true
    icon: mdi:heart-pulse
    lambda: 'return false;'
    filters:
      - delayed_off: 60s

  - platform: template
    name: Flusserkennung
    id: sensor_heizkreis_aktiv
    device_id: heizkreis
    icon: mdi:heart-pulse
    lambda: 'return id(intern_heizkreis_aktiv).state;'

  - platform: template
    name: Flusserkennung
    id: sensor_wwb_aktiv
    device_id: warmwasserspeicher
    icon: mdi:heart-pulse
    lambda: 'return id(intern_wwb_aktiv).state;'

switch:
  # Umschalten zwischen Heizkreis und WWB bedeutet sofortiges zum Stillstand kommen des Flows im anderen Kreis.
  # Umschalten bedeutet nicht automatisch, dass auch Wasser fließt (insbsondere im Heizkreis)
  - id: !extend wwb_anforderung
    on_turn_on:
      - binary_sensor.template.publish:
          id: sensor_heizkreis_aktiv
          state: OFF
    on_turn_off:
      - binary_sensor.template.publish:
          id: sensor_wwb_aktiv
          state: OFF
