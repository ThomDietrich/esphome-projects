# ============================================================================
# Gastherme Sollwertsteuerung — 0-10V via EM10 PWM-Modul
# ============================================================================
# Steuert die Vorlauf-Solltemperatur der Gastherme ueber ein EM10-Modul,
# das ein PWM-Signal (GPIO27) in eine 0–10V Analogspannung umsetzt.
#
# Signalkette:  Temperatur [°C] → Spannung [V] → PWM [%]
#   Die Umrechnung basiert auf einer linearen Regression (Messwerte aus
#   Kalibriertabelle). Die Koeffizienten sind im Lambda hinterlegt.
#
# Failsafe beim Booten:
#   PWM wird auf 20% gesetzt (~30°C Sollwert) — sicher genug, um bei
#   einem Neustart im Winter nicht einzufrieren, ohne zu ueberheizen.
#
# Steuerung ueber Home Assistant:
#   Die API-Action "gastherme_solltemperatur_set" nimmt eine Temperatur
#   in °C entgegen und setzt PWM-Ausgang sowie drei Diagnosesensoren
#   (Temperatur, Spannung, PWM-Prozent).
# ============================================================================

output:
  - platform: ledc
    pin: GPIO27
    frequency: 1220 Hz
    id: heiz_sollwert_pwm_output
    inverted: false
    min_power: 0.00
    max_power: 1.00

esphome:
  on_boot:
    - priority: 500
      # When hardware initialized
      # Failsafe: ~30°C (20% PWM) — safe default to prevent freezing without overheating
      then:
        - lambda: |-
            id(heiz_sollwert_pwm_output).set_level(0.2);

sensor:
  - platform: template
    name: "Gastherme Sollwert ESP (Temperatur)"
    id: gastherme_sollwert_degc_sensor
    icon: mdi:thermometer-chevron-up
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    update_interval: never

  - platform: template
    name: "Gastherme Sollwert ESP (Spannung)"
    id: gastherme_sollwert_volt_sensor
    icon: mdi:power-plug-outline
    unit_of_measurement: "V"
    accuracy_decimals: 1
    update_interval: never

  - platform: template
    name: "Gastherme Sollwert ESP (PWM)"
    id: gastherme_sollwert_pwm_sensor
    icon: mdi:timelapse
    unit_of_measurement: "%"
    accuracy_decimals: 0
    update_interval: never

api:
  actions:
    - action: gastherme_solltemperatur_set  # Wird erweitert um "esphome.heizungsregelung_"
      variables:
        temperature: float
      then:
        - lambda: |-
            double degc = temperature;
            // Coefficients from linear fit (spreadsheet) of measured °C-to-V and V-to-PWM% curves
            double volt = degc * 0.1253 - 1.2751;
            double pwm_pct = (volt - 0.4535) * 10.05;

            id(gastherme_sollwert_degc_sensor).publish_state(
              min(90.0, max(0.0, degc))
            );
            id(gastherme_sollwert_volt_sensor).publish_state(
              min(10.0, max(0.0, volt))
            );
            id(gastherme_sollwert_pwm_sensor).publish_state(
              min(100.0, max(0.0, pwm_pct))
            );
            id(heiz_sollwert_pwm_output).set_level(
              min(1.0, max(0.0, pwm_pct / 100.0))
            );
