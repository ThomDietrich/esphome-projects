# ============================================================================
# Temperaturdifferenzen — Spreizungen aller Kreislaeufe
# ============================================================================
# Berechnete Temperaturdifferenzen (Spreizungen) in Kelvin fuer jeden
# hydraulischen Kreislauf. Alle Sensoren haben update_interval: never
# und werden on_value der zugehoerigen Temperatursensoren getriggert.
#
#   - Solarkreis Differenz Eintrag (RL−VL):
#     Waermegewinn im Solarthermiefeld. Positiv = Kollektor heizt.
#   - Solarkreis Differenz oben-unten (Kollektor−Speicher unten):
#     Steuergrösse fuer Solarkreispumpe — positiv = Kollektor waermer.
#   - Heizkreis Differenz (VL−RL):
#     Waermeabgabe an Heizkoerper.
#   - Warmwasser Differenz (VL−RL):
#     Waermeabgabe an Warmwasserspeicher (nur bei WWB aktiv).
#   - Kessel Differenz (VL−RL):
#     Waermeabgabe des Brenners.
#   - Kesselpufferkreis Differenz (VL−RL):
#     Waermetransport zwischen Kessel und Pufferspeicher.
#
# Heizkreis- und Warmwasser-Differenz werden von den Waermezaehlern
# (heizungsregelung_energy_heat_counter.yaml) fuer die Energieberechnung
# verwendet.
# ============================================================================

sensor:

  - platform: template
    name: Solarkreis Differenz Eintrag
    id: solarkreis_diff_rlvl
    state_class: measurement
    device_class: temperature
    unit_of_measurement: K
    accuracy_decimals: 1
    icon: mdi:thermometer-lines
    update_interval: never
    lambda: |-
      return (id(solarkreis_rl).state - id(solarkreis_vl).state);

  - platform: template
    name: Solarkreis Differenz oben-unten
    id: solarkreis_diff_ou
    state_class: measurement
    device_class: temperature
    unit_of_measurement: K
    accuracy_decimals: 1
    icon: mdi:thermometer-lines
    update_interval: never
    lambda: |-
      return (id(sonnenkollektor).state - id(warmwasserspeicher_unten).state);

  - platform: template
    name: Heizkreis Differenz
    id: heizkreis_diff
    state_class: measurement
    device_class: temperature
    unit_of_measurement: K
    accuracy_decimals: 1
    icon: mdi:thermometer-lines
    update_interval: never
    lambda: |-
      return (id(heizkreis_vl).state - id(heizkreis_rl).state);

  - platform: template
    name: Warmwasser Differenz
    id: warmwasser_diff
    state_class: measurement
    device_class: temperature
    unit_of_measurement: K
    accuracy_decimals: 1
    icon: mdi:thermometer-lines
    update_interval: never
    lambda: |-
      return (id(gastherme_vl).state - id(gastherme_rl_wwb).state);

  - platform: template
    name: Kessel Differenz
    id: kessel_diff
    state_class: measurement
    device_class: temperature
    unit_of_measurement: K
    accuracy_decimals: 1
    icon: mdi:thermometer-lines
    update_interval: never
    lambda: |-
      return (id(kessel_vl).state - id(kessel_rl).state);

  - platform: template
    name: Kesselpufferkreis Differenz
    id: kesselpufferkreis_diff
    state_class: measurement
    device_class: temperature
    unit_of_measurement: K
    accuracy_decimals: 1
    icon: mdi:thermometer-lines
    update_interval: never
    lambda: |-
      return (id(kesselpufferkreis_vl).state - id(kesselpufferkreis_rl).state);
