
output:
  - platform: ledc
    pin:
      number: ${buzzer_pin}
      ignore_strapping_warning: true
    id: rtttl_out_buzzer

rtttl:
  output: rtttl_out_buzzer

button:
  - platform: template
    name: "Two Beeps"
    on_press:
      - rtttl.play: "two short:d=4,o=5,b=100:12g6,16c6"

api:
  actions:
    - action: play_rtttl
      variables:
        song_str: string
      then:
        - rtttl.play:
            rtttl: !lambda 'return song_str;'
