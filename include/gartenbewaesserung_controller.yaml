
# MCP23017 Configuration
#
# VCC - Not needed for this project
# GND - Physically extended to 10 connectors: 5x LED common and Pushbutton common
#
# # Power button
# PB7 (15) - LED0 Button input (pull-up)
# PB6 (14) - LED0 R (only button where we use the red channel, due to multiplexer size)
# PB5 (13) - LED0 G
# PB4 (12) - LED0 Y
# # Valve 1 button
# PB3 (11) - LED1 Button input (pull-up)
# PB2 (10) - LED1 G
# PB1 (09) - LED1 Y
# # Valve 2 button
# PB0 (08) - LED2 Button input (pull-up)
# PA0 (00) - LED2 G
# PA1 (01) - LED2 Y
# # Valve 3 button
# PA2 (02) - LED3 Button input (pull-up)
# PA3 (03) - LED3 G
# PA4 (04) - LED3 Y
# # Valve 4 button
# PA5 (05) - LED4 Button input (pull-up)
# PA6 (06) - LED4 G
# PA7 (07) - LED4 Y

# I2C expected in main project
#
# ------------------------------------------------------------------------------------------------------------------------
# MCP23017 Interrupt-Upgrade (optional, ab ESPHome 2026.4.0)
# ------------------------------------------------------------------------------------------------------------------------
#
# Aktuell werden die 5 Taster per I2C-Polling gelesen (default ~17ms Intervall). Das funktioniert,
# erzeugt aber kontinuierlich I2C-Traffic auch wenn kein Taster gedrueckt wird.
#
# Ab ESPHome 2026.4.0 unterstuetzt der MCP23017 Interrupt-Pins. Damit wird der I2C-Bus nur noch
# bei tatsaechlicher Tasterbetaetigung gelesen (99.7% weniger I2C-Reads im Idle, 300x schnellere
# Reaktion lt. Release Notes).
#
# Noetige Aenderungen:
#
#   1. Hardware: EINEN freien ESP32-GPIO mit dem INT-Ausgang des MCP23017 verbinden (INTA ODER INTB).
#      Im Interrupt-Betrieb spiegelt der MCP23017 (MIRROR-Bit) alle 16 Pins auf beide INT-Ausgaenge —
#      ein einzelner Interrupt-Pin genuegt also fuer alle Taster. Dass diese auf BEIDEN Ports liegen
#      (Taster 0/1/2 = Port B: PB7/PB3/PB0;  Taster 3/4 = Port A: PA2/PA5) spielt damit keine Rolle.
#      Belegte GPIOs: 4 (LED), 12 (Buzzer), 13 (SDA), 14 (SCL), 25/26/32/33 (Relais).
#      Freie GPIOs am ASTRA BR4G8AL: GPIO2, GPIO15, GPIO16, GPIO17, GPIO18, GPIO19, GPIO21-23, GPIO27.
#      Empfehlung: GPIO27 (kein Strapping-Pin, gut zugaenglich).
#
#   2. Software (a): Interrupt-Pin am MCP23017-Hub ergaenzen:
#
#      mcp23017:
#        - id: mcp23017_portexpander
#          address: 0x20
#          interrupt_pin: GPIO27          # ESP32-GPIO, verbunden mit MCP23017 INTA oder INTB
#          # open_drain_interrupt: true   # nur falls MCP23017 mit >3.3V versorgt wird (ext. Pull-up noetig)
#
#   3. Software (b): An JEDEM Taster-binary_sensor den Interrupt-Trigger ergaenzen (sonst weiter Polling):
#
#      pin:
#        mcp23xxx: mcp23017_portexpander
#        number: 15                       # Beispiel Taster 0
#        mode: INPUT_PULLUP
#        inverted: true
#        interrupt: CHANGE                # CHANGE | RISING | FALLING
#
#   Doku: https://esphome.io/components/mcp230xx/
# ------------------------------------------------------------------------------------------------------------------------


# https://esphome.io/components/mcp230xx.html
mcp23017:
  - id: mcp23017_portexpander
    address: 0x20


# https://esphome.io/components/event/index.html
# https://esphome.io/components/event/template.html
event:
  - platform: template
    name: Taster
    id: taster_ereignis
    device_class: button
    event_types:
      - controller_button_pressed_event_0
      - controller_button_pressed_event_1
      - controller_button_pressed_event_2
      - controller_button_pressed_event_3
      - controller_button_pressed_event_4


# https://esphome.io/components/binary_sensor/gpio.html
binary_sensor:
  - platform: gpio
    name: Taster 0
    pin:
      mcp23xxx: mcp23017_portexpander
      number: 15
      mode: INPUT_PULLUP
      inverted: true
    internal: false
    filters:
      - delayed_on_off: 100ms
    on_press:
      then:
        - event.trigger:
            id: taster_ereignis
            event_type: controller_button_pressed_event_0
        # Phase 2: Pumpen-Soll lokal toggeln + an die Pumpe senden (siehe gartenbewaesserung_pumpe_link.yaml).
        # Ersetzt die alte HA-Pumpe-Toggle-Automation.
        - lambda: 'id(pumpe_soll) = !id(pumpe_soll);'
        - lambda: 'id(pumpe_anforderung).publish_state(id(pumpe_soll));'
        # Sofort-Feedback (optimistisch aus dem Soll) + Ton; taster0_led_aktualisieren korrigiert spaeter auf den
        # echten Zustand (gruen=einsatzbereit -> gelb sobald Last anliegt, siehe gartenbewaesserung_pumpe_link.yaml).
        - if:
            condition:
              lambda: 'return id(pumpe_soll);'
            then:
              - select.set:
                  id: taster_0_led
                  option: "green"
              - rtttl.play: "pumpon:d=16,o=6,b=160:g5,c6"     # aufsteigend = Pumpe AN
            else:
              - select.set:
                  id: taster_0_led
                  option: "off"
              - rtttl.play: "pumpoff:d=16,o=6,b=160:c6,g5"    # absteigend = Pumpe AUS

  - platform: gpio
    name: Taster 1
    pin:
      mcp23xxx: mcp23017_portexpander
      number: 11
      mode: INPUT_PULLUP
      inverted: true
    internal: false
    filters:
      - delayed_on_off: 100ms
    on_press:
      then:
        - rtttl.play: "blip:d=32,o=6,b=200:c"   # Tastendruck-Quittung
        - switch.toggle: ventil_1
        - event.trigger:
            id: taster_ereignis
            event_type: controller_button_pressed_event_1

  - platform: gpio
    name: Taster 2
    pin:
      mcp23xxx: mcp23017_portexpander
      number: 8
      mode: INPUT_PULLUP
      inverted: true
    internal: false
    filters:
      - delayed_on_off: 100ms
    on_press:
      then:
        - rtttl.play: "blip:d=32,o=6,b=200:c"   # Tastendruck-Quittung
        - switch.toggle: ventil_2
        - event.trigger:
            id: taster_ereignis
            event_type: controller_button_pressed_event_2

  - platform: gpio
    name: Taster 3
    pin:
      mcp23xxx: mcp23017_portexpander
      number: 2
      mode: INPUT_PULLUP
      inverted: true
    internal: false
    filters:
      - delayed_on_off: 100ms
    on_press:
      then:
        - rtttl.play: "blip:d=32,o=6,b=200:c"   # Tastendruck-Quittung
        - switch.toggle: ventil_3
        - event.trigger:
            id: taster_ereignis
            event_type: controller_button_pressed_event_3

  - platform: gpio
    name: Taster 4
    pin:
      mcp23xxx: mcp23017_portexpander
      number: 5
      mode: INPUT_PULLUP
      inverted: true
    internal: false
    filters:
      - delayed_on_off: 100ms
    on_press:
      then:
        - rtttl.play: "blip:d=32,o=6,b=200:c"   # Tastendruck-Quittung
        - switch.toggle: ventil_4
        - event.trigger:
            id: taster_ereignis
            event_type: controller_button_pressed_event_4


