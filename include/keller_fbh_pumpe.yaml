# ======================================================================================================================
# Umwälzpumpe — Fussbodenheizung
# ======================================================================================================================
# Pumpe: Wilo Stratos Pico Plus
# Ansteuerung: Netzschaltung über Relay 4 (GPIO32, 230V AC EIN/AUS)
#
# Die Pumpe hat einen eigenen Schalter und ist unabhängig von der Mischkreis-Automatik (keller_fbh_betrieb.yaml)
# steuerbar.
#
# Anlaufstrom: < 5A — innerhalb der Relais-Schaltleistung (16A).
#
# Empfohlene Betriebsart an der Pumpe:
#   Δp-c (Proportionaldruck konstant) — empfohlen für Fussbodenheizung
#   Alternativ: Δp-v oder Konstantdrehzahl je nach Anlage
#
# WICHTIG: Netzspannung nicht mit Phasenanschnitt schalten (kein Dimmer)! Die Elektronik der Pumpe verträgt nur
#          sinusförmige Wechselspannung.
#
# Betriebsstundenzähler:
#   Alle 15 Minuten wird geprüft, ob die Pumpe läuft. Wenn ja, werden 900 Sekunden aufaddiert. Der Zähler ist
#   persistent über Neustarts.
#
#
# Wilo-Connect BMS Modul — Erweiterungsoption
# ======================================================================================================================
# Das BMS-Modul wird auf die Wilo-Connectivity-Schnittstelle der Pumpe aufgesteckt (unter der abschließbaren
# Modulabdeckung).
#
# Eingänge des BMS-Moduls:
#   Digitaleingang — potentialfreier Kontakt oder 24V Signal
#     Konfigurierbare Funktionen:
#       Ext. OFF — Pumpe aus (Freigabekontakt)
#       Ext. MIN — Pumpe auf Minimaldrehzahl
#       Ext. MAX — Pumpe auf Maximaldrehzahl
#   Analogeingang — 0-10V DC Sollwertvorgabe
#     Förderhöhe oder Drehzahl extern vorgeben
#
# Ausgänge des BMS-Moduls (potentialfreier Wechselkontakt):
#   COM + NC — Störmeldung (SSM), öffnet bei Störung
#   COM + NO — Betriebsmeldung (SBM), schließt bei Betrieb
#
# Mögliche Anbindung an ASTRA BR4G8AL (nicht implementiert):
#   GPIO14 (I/O) → Digitaleingang BMS (Ext. OFF als Freigabe)
#   GPIO15 (I/O) → Analogausgang wäre ideal, ESP32 hat aber keinen echten DAC mit 0-10V — externer DAC (z.B. MCP4725
#                   über I2C + OPV) wäre nötig für Sollwertvorgabe
#   GPIO34 (Input) → Störmeldung (SSM) vom BMS-Modul lesen
#   GPIO35 (Input) → Betriebsmeldung (SBM) vom BMS-Modul lesen
#
# ======================================================================================================================


# ======================================================================================================================
# Relais — Umwälzpumpe EIN/AUS
# ======================================================================================================================

switch:
  - platform: gpio
    pin: GPIO32
    name: "Schalter"
    id: pumpe_fbh
    device_id: umwaelzpumpe
    icon: "mdi:pump"
    restore_mode: RESTORE_DEFAULT_ON
    on_turn_on:
      - lambda: "id(pumpe_schaltzyklen) += 1;"
      - component.update: pumpe_schaltzyklen_sensor


# ======================================================================================================================
# Globale Variablen — Betriebsstundenzähler
# ======================================================================================================================

globals:
  # Gesamte Betriebszeit der Umwälzpumpe [Sekunden]
  - id: pumpe_betriebsstunden_s
    type: int
    restore_value: true
    initial_value: "0"

  # Anzahl der Einschaltvorgaenge der Umwaelzpumpe
  - id: pumpe_schaltzyklen
    type: int
    restore_value: true
    initial_value: "0"


# ======================================================================================================================
# Betriebsstundenzähler — 15-Minuten-Intervall
# ======================================================================================================================

interval:
  - interval: 15min
    then:
      - lambda: |-
          if (id(pumpe_fbh).state) {
            id(pumpe_betriebsstunden_s) += 900;
          }


# ======================================================================================================================
# Sensor — Betriebsstunden
# ======================================================================================================================

sensor:
  - platform: template
    name: "Betriebsstunden"
    id: pumpe_betriebsstunden_sensor
    device_id: umwaelzpumpe
    unit_of_measurement: "h"
    accuracy_decimals: 1
    icon: "mdi:pump"
    device_class: duration
    state_class: total_increasing
    entity_category: diagnostic
    update_interval: 60s
    lambda: |-
      return id(pumpe_betriebsstunden_s) / 3600.0;

  - platform: template
    name: "Schaltzyklen"
    id: pumpe_schaltzyklen_sensor
    device_id: umwaelzpumpe
    accuracy_decimals: 0
    icon: "mdi:counter"
    state_class: total_increasing
    entity_category: diagnostic
    update_interval: 60s
    lambda: |-
      return id(pumpe_schaltzyklen);
