# ======================================================================================================================
# PID-Regler — Vorlauftemperatur-Regelung Fussbodenheizung
# ======================================================================================================================
#
# Regelt die FBH-Vorlauftemperatur über das Dreiwege-Mischventil (Oventrop Regumat).
# Die Kombination mit dem Feedforward erfolgt in keller_fbh_mischventil_steuerung.yaml.
#
#   Regelgröße:    FBH-Vorlauftemperatur T_FBH_VL (DS18B20, 5s Abtastrate)
#   Führungsgröße: Vorlauf-Solltemperatur (einstellbar über HA Climate-Entity)
#   Stellgröße:    Ventilöffnung 0.0–1.0 (0% = Bypass/kalt, 100% = Primär/heiss)
#   Störgrößen:    Primär-Vorlauftemperatur (dominant, schwankt durch Brennerzyklen 32–48°C)
#                  FBH-Rücklauftemperatur (untergeordnet, ändert sich langsam durch Raumlast/Estrichträgheit)
#
#
# 1. ARCHITEKTUR — REGELUNGSKASKADE
# ======================================================================================================================
#
#   ┌─────────────────────────────────────────────────────────────────────────────────┐
#   │  Feedforward (*_feedforward.yaml)                                   → V_ff    │
#   │    V_ff = (T_Soll - T_RL) / (T_Prim - T_RL)                                  │
#   ├─────────────────────────────────────────────────────────────────────────────────┤
#   │  PID-Regler (dieses File)                                           → V_pid   │
#   │    Korrigiert Modellungenauigkeiten und Restfehler                             │
#   ├─────────────────────────────────────────────────────────────────────────────────┤
#   │  Kombination + Positionsregler (*_steuerung.yaml)                    Stufe 2   │
#   │    V_soll = α × V_ff + (1 − α) × V_pid                                       │
#   │    Vergleicht V_soll mit geschätzter Ist-Öffnung                               │
#   │    Erzeugt diskrete Relaisimpulse für 3-Punkt-Stellantrieb                     │
#   └─────────────────────────────────────────────────────────────────────────────────┘
#
#   Manueller Override (*_steuerung.yaml) umgeht die gesamte Kaskade.
#
#
# 2. PID-REGLER
# ======================================================================================================================
#
# Berechnet Stellgröße u(t) aus Regelfehler e(t) = Sollwert − Istwert:
#
#   u(t) = Kp · e(t) + Ki · ∫e(t)dt + Kd · de(t)/dt
#
#   P (proportional):   Sofortige Reaktion auf Fehler. Kp × Fehler = Stellgrößenänderung.
#   I (integral):       Summiert Fehler über Zeit → eliminiert bleibende Abweichung.
#   D (differentiell):  Reagiert auf Fehler-Änderungsrate → dämpft Überschwinger.
#                       Aktuell deaktiviert (Kd=0) wegen DS18B20-Rauschen (±0.5°C).
#
# Aktuelle Parameter (Tuning-Historie siehe Abschnitt 6):
#   Kp = ${pid_kp}   Proportionalverstärkung
#   Ki = ${pid_ki}   Integralverstärkung
#   Kd = ${pid_kd}   Differentialverstärkung
#   output_averaging_samples: 5       Glättung über 5 Zyklen (25s)
#   derivative_averaging_samples: 8   Glättung D-Anteil über 8 Zyklen (40s)
#
#
# 3. TOTZONE (DEADBAND)
# ======================================================================================================================
#
# ±0,5 K um den Sollwert. Reduziert Ventilbewegungen im eingeschwungenen Zustand:
#   kp_multiplier: 0.0   P deaktiviert — keine Reaktion auf Kleinstfehler
#   ki_multiplier: 0.05  I auf 5% — nur langsame Drift-Kompensation
#   kd_multiplier: 0.0   D deaktiviert
#   deadband_output_averaging_samples: 15   zusätzliche Glättung
# Zweck: Verschleißminimierung am Stellantrieb.
#
#
# 4. ANTI-WINDUP UND KALTSTARTSCHUTZ
# ======================================================================================================================
#
# Integral Windup: I-Anteil akkumuliert bei saturierter Stellgröße → Überschwingen.
#
# Gegenmaßnahmen:
#   1. Integral Clamping (max_integral: 0.8)
#      I-Anteil maximal 80% der Stellgröße.
#   2. Integral Reset beim Einschalten (keller_fbh_betrieb.yaml)
#      climate.pid.reset_integral_term bei Automatik-Aktivierung.
#   3. Maximale Schrittweite (MAX_IMPULS_MS=15s in keller_fbh_mischventil_steuerung.yaml)
#      Ventil bewegt max. 10% Hub pro 10s-Zyklus.
#   4. Deadband mit reduziertem Ki (siehe Abschnitt 3)
#
#
# 5. AUTOTUNING
# ======================================================================================================================
#
# Button „PID Autotuning" startet ESPHome PID-Autotuning (Relay-Methode → Ziegler-Nichols).
# Voraussetzung: System nahe Sollwert, stabile Primärtemperatur. Dauer: 1–3 Stunden.
# ACHTUNG: Neue Parameter nur im RAM — nach Ermittlung in YAML eintragen und flashen.
#
#
# 6. TUNING-HISTORIE
# ======================================================================================================================
#
# Randbedingungen: Primär-Vorlauf ~32–48°C (Brennerzyklen), Sollwert 23–25°C,
# Stellantrieb 140s Laufzeit, DS18B20 5s, Positionsregler 10s, MAX_IMPULS_MS=15s.
#
# Schritt 1 (2026-03-26): Kp=0.6, Ki=0.0015, Kd=0 (Startwerte)
#   Beobachtung: Dauerschwingung ±3 K, Periode ~10 min, Bang-Bang 0–80%.
#   Diagnose: Grenzzyklus bei Ku≈0.6, Tu≈10 min.
#   → Ziegler-Nichols: Kp=0.27, Ki=0.0005. Gewählt: Kp=0.2 (konservativer wegen Totzeit).
#
# Schritt 2 (2026-03-26): Kp=0.2, Ki=0.0005, Kd=0
#   Beobachtung: ±1.5–2 K, Periode ~40 min, Ventil 0–40%. +4.5 K Überschwingen.
#   Diagnose: Arbeitspunkt 10–15%, Totzeit verstärkt Überschwingen.
#   → Kp=0.1, Ki=0.0003.
#
# Schritt 3 (2026-03-27): Kp=0.1, Ki=0.0003, Kd=0
#   Beobachtung: Stabil ±1 K im Deadband. Ventil 5–10%. Kompensiert Brennerzyklen.
#   → Beibehalten. Feedforward-Erweiterung für bessere Störkompensation.
#
# Schritt 4 (2026-03-27): Kp=0.1, Ki=0.0005, Kd=0 + Feedforward (FF=60–70%)
#   Änderung: FF mit Gastherme-Sensor als Primärquelle (sensor.heizungsregelung_gastherme_vorlauf),
#   Fallback auf lokalen t_prim_vl. Ki von 0.0003→0.0005 angehoben, da PID bei FF>60% nur noch
#   ~30–40% der Stellgröße beeinflusst — schnellere Offset-Korrektur ohne Schwingungsgefahr.
#   Beobachtung FF=60%: Sollwert-Sprung 25→27.5°C: +2.5 K Überschwingen (vorher +4.5 K ohne FF).
#   Einschwingzeit ~20 min. Bei Pufferspeicher-Betrieb (konstante Primärtemp.) stabil ±0.5 K.
#   → FF-Anteil auf 80% erhöht.
#
# Schritt 5 (2026-03-27): Kp=0.1, Ki=0.0005, Kd=0 + Feedforward (FF=80%)
#   Beobachtung: Stabil ±0.5 K über 2h bei Pufferspeicher-Betrieb. Aber: bleibender Offset
#   von 2.6 K unter Sollwert — PID mit nur 20% Gewichtung kann den FF-Modellfehler nicht
#   ausregeln. I-Anteil saturiert bei max_integral, reicht aber nicht.
#   → Ki verdoppelt auf 0.001, FF zurück auf 70%.
#
# Schritt 6 (2026-03-27): Kp=0.1, Ki=0.001, Kd=0 + Feedforward (FF=70%)
#   Beobachtung: Stabil ±0.5 K über 5h bei Sollwert 27.5°C mit Pufferspeicher-Betrieb.
#   Kompensiert Primärschwankungen (Gastherme 35–65°C) mit kurzen Dips ±1 K.
#   → Parameter bei Pufferbetrieb gut. Erneuter Test bei direktem Brennerbetrieb nötig.
#
# Schritt 7 (2026-03-29): Kp=0.1, Ki=0.002, Kd=0 + Feedforward (FF=60%)
#   Anlass: Sollwert 30°C bei Gastherme ~45°C. Bleibender Offset von 1–2 K unter Sollwert.
#   PID Stellgröße bei 70–80% (nahe Sättigung), Ventilöffnung nur 30–40%.
#   Diagnose: FF-Modell unterschätzt nötige Ventilöffnung (nichtlineare Ventilkennlinie,
#   Mischungsgleichung nimmt ideale Durchmischung an). PID mit 30% Gewichtung (bei FF=70%)
#   kann Defizit nicht ausgleichen.
#   → Ki verdoppelt auf 0.002 (schnellere Offset-Korrektur), FF auf 60% reduziert (PID hat
#     jetzt 40% Gewichtung → effektiver PID-Beitrag: 0.4 × 80% = 32% statt vorher 0.3 × 80% = 24%).
#
# Schritt 8 (2026-03-29): Kp=0.05, Ki=0.002, Kd=0 + Feedforward (FF=70%) ← AKTUELL
#   Anlass: Sollwert 32°C bei Gastherme ~67°C. Grenzzyklus ±5–8 K, Periode ~10 min,
#   PID Stellgröße 0–100% bang-bang. Prozessverstärkung ~2× höher als beim Tuning
#   (ΔT=45 K statt 23 K bei Schritt 3).
#   Zwischenschritt: FF auf 85% erhöht → Grenzzyklus gebrochen, aber bleibender Offset
#   ~2–3 K unter Sollwert (PID mit 15% Gewicht kann nicht genug korrigieren).
#   → Kp halbiert auf 0.05 (Stabilitätsreserve bei hoher Primärtemp), FF zurück auf 70%
#     (PID hat 30% Gewicht). Effektive Verstärkung: 0.05 × 0.3 = 0.015 (vorher 0.1 × 0.4 = 0.04).
#   Zusätzlich: FF-Primärtemperatur von Gastherme VL (HA-Sensor) auf lokalen t_prim_vl
#   (DS18B20 vor Mischer) umgestellt. Gastherme VL war 15–20 K höher als tatsächliche
#   Temperatur am Mischpunkt → FF unterschätzte systematisch die nötige Ventilöffnung.
#   Lokaler Sensor liefert korrekte Temperatur und natürliche Glättung durch Rohrleitung.
#
# Nächste Schritte bei Tuning-Bedarf:
#   - Gain Scheduling: Kp automatisch an (T_Prim − T_RL) anpassen für stabile Regelung
#     über den gesamten Betriebsbereich (35–70°C Primärtemperatur)
#   - FF-Modell verbessern: nichtlineare Ventilkennlinie als Korrekturfaktor
#   - Ki nachziehen falls Offset bleibt: Ki ≈ Kp / (Periode_s × 0.5)
#
# ======================================================================================================================


# ======================================================================================================================
# Template-Output — PID-Ausgang
# ======================================================================================================================
# Die PID climate-Komponente schreibt ihre Stellgröße auf diesen Output. Der Wert wird
# gespeichert und an recalculate_valve_target (keller_fbh_mischventil_steuerung.yaml)
# übergeben, wo die Kombination mit dem Feedforward erfolgt.

output:
  - platform: template
    id: pid_output_position
    type: float
    write_action:
      - script.execute: recalculate_valve_target


# ======================================================================================================================
# PID Climate — Vorlauftemperatur-Regelung
# ======================================================================================================================

climate:
  - platform: pid
    id: pid_mischkreis
    name: "Vorlaufregelung"
    device_id: mischer
    sensor: t_fbh_vl
    default_target_temperature: ${sollwert_vorlauf}
    heat_output: pid_output_position
    visual:
      min_temperature: 20
      max_temperature: 50
      temperature_step: 0.5
    control_parameters:
      kp: ${pid_kp}
      ki: ${pid_ki}
      kd: ${pid_kd}
      max_integral: 0.8
      output_averaging_samples: 5
      derivative_averaging_samples: 8
    on_control:
      then:
        - component.update: t_prim_headroom
        - component.update: reglerzustand
    deadband_parameters:
      threshold_high: 0.5
      threshold_low: -0.5
      kp_multiplier: 0.0
      ki_multiplier: 0.05
      kd_multiplier: 0.0
      deadband_output_averaging_samples: 15


# ======================================================================================================================
# PID-Diagnosesensoren
# ======================================================================================================================

sensor:
  - platform: template
    name: "Vorlauf Sollwert"
    id: vorlauf_sollwert_sensor
    device_id: mischer
    unit_of_measurement: "°C"
    device_class: temperature
    accuracy_decimals: 1
    icon: "mdi:thermometer-check"
    update_interval: 30s
    lambda: |-
      return id(pid_mischkreis).target_temperature;

  - platform: pid
    climate_id: pid_mischkreis
    name: "PID P-Anteil"
    device_id: mischer
    type: PROPORTIONAL

  - platform: pid
    climate_id: pid_mischkreis
    name: "PID I-Anteil"
    device_id: mischer
    type: INTEGRAL

  - platform: pid
    climate_id: pid_mischkreis
    name: "PID D-Anteil"
    device_id: mischer
    type: DERIVATIVE

  - platform: pid
    climate_id: pid_mischkreis
    name: "PID Regelfehler"
    device_id: mischer
    type: ERROR
    unit_of_measurement: "K"
    accuracy_decimals: 1
    filters:
      - multiply: 0.01

  - platform: pid
    climate_id: pid_mischkreis
    name: "PID Stellgroesse"
    device_id: mischer
    type: HEAT
    unit_of_measurement: "%"


# ======================================================================================================================
# PID-Parameter — über Home Assistant live einstellbar
# ======================================================================================================================
# Kp und Ki können ohne Flash angepasst werden. Die Werte werden persistent gespeichert
# und beim Boot an den PID-Regler übergeben. Änderungen wirken sofort, der I-Anteil wird
# bei Kp/Ki-Änderung zurückgesetzt um Windup aus alten Parametern zu vermeiden.

number:
  - platform: template
    name: "PID Kp"
    id: pid_kp_nr
    device_id: mischer
    icon: "mdi:alpha-p-circle"
    entity_category: config
    min_value: 0.01
    max_value: 1.0
    step: 0.01
    mode: box
    initial_value: ${pid_kp}
    restore_value: true
    optimistic: true
    set_action:
      - lambda: |-
          id(pid_mischkreis).set_kp(x);
      - climate.pid.reset_integral_term: pid_mischkreis
      - logger.log:
          level: INFO
          format: "PID Kp geaendert: %.3f — Integral reset"
          args: ['x']

  - platform: template
    name: "PID Ki"
    id: pid_ki_nr
    device_id: mischer
    icon: "mdi:alpha-i-circle"
    entity_category: config
    min_value: 0.0001
    max_value: 0.01
    step: 0.0001
    mode: box
    initial_value: ${pid_ki}
    restore_value: true
    optimistic: true
    set_action:
      - lambda: |-
          id(pid_mischkreis).set_ki(x);
      - climate.pid.reset_integral_term: pid_mischkreis
      - logger.log:
          level: INFO
          format: "PID Ki geaendert: %.4f — Integral reset"
          args: ['x']


# ======================================================================================================================
# Boot-Initialisierung — gespeicherte PID-Parameter laden
# ======================================================================================================================

esphome:
  on_boot:
    priority: -100
    then:
      - lambda: |-
          id(pid_mischkreis).set_kp(id(pid_kp_nr).state);
          id(pid_mischkreis).set_ki(id(pid_ki_nr).state);
          ESP_LOGI("pid", "PID-Parameter aus NVS geladen: Kp=%.3f Ki=%.4f",
                   id(pid_kp_nr).state, id(pid_ki_nr).state);


# ======================================================================================================================
# Taste — PID-Autotuning
# ======================================================================================================================

button:
  - platform: template
    name: "PID Autotuning"
    device_id: mischer
    icon: "mdi:tune"
    entity_category: config
    on_press:
      - climate.pid.autotune:
          id: pid_mischkreis
          noiseband: 0.5
          positive_output: 1.0
          negative_output: 0.0
