# ============================================================================
# Relais und Pumpensteuerung — 4x 230V Schaltausgaenge
# ============================================================================
# Vier Relais schalten 230V-Verbraucher:
#
#   Relais 1 (GPIO4):  Kesselpufferkreis Umwaelzpumpe
#   Relais 2 (GPIO0):  Solarkreis Umwaelzpumpe (Strapping-Pin, s.u.)
#   Relais 3 (GPIO2):  Warmwasser Zirkulationspumpe (Strapping-Pin)
#   Relais 4 (GPIO15): Warmwasserbereitung Anforderung (potentialfreier
#                       Kontakt zur Gastherme, Strapping-Pin)
#
# Alle Relais sind active-low (inverted: true) und starten im AUS-Zustand.
# GPIO0 ist ein Strapping-Pin: HIGH beim Boot = normaler Bootmodus.
# inverted: true + ALWAYS_OFF stellt sicher, dass der physische Pegel
# beim Boot HIGH ist (Relais AUS).
#
# Relais 4 (WWB Anforderung) steuert, ob die Gastherme im Heizmodus
# oder Warmwasserbereitungsmodus arbeitet. Beim Umschalten werden die
# Temperaturdifferenz-Sensoren und Waermezaehler sofort aktualisiert.
#
# Betriebsstundenzaehler:
#   Jede Pumpe hat einen duty_time-Sensor (state_class: total_increasing),
#   der die Einschaltdauer in Stunden zaehlt. Werte gehen beim Neustart
#   verloren — Home Assistant akkumuliert den Gesamtwert.
# ============================================================================

switch:
  # Relais 1
  - platform: gpio
    name: "Kesselpufferkreis Umwaelzpumpe"
    id: switch_kesselpufferkreis_pumpe
    pin:
      number: GPIO4
      inverted: true
    restore_mode: ALWAYS_OFF

  # Relais 2
  # GPIO0 is a strapping pin (must be HIGH during boot for normal boot mode).
  # inverted: true + ALWAYS_OFF ensures physical HIGH at boot = relay OFF.
  - platform: gpio
    name: "Solarkreis Umwaelzpumpe"
    id: switch_solarkreis_pumpe
    pin:
      number: GPIO0
      inverted: true
      ignore_strapping_warning: true
    restore_mode: ALWAYS_OFF

  # Relais 3
  - platform: gpio
    name: "Warmwasser Zirkulationspumpe"
    id: switch_warmwasser_zirkulation
    pin:
      number: GPIO2
      inverted: true
      ignore_strapping_warning: true
    restore_mode: ALWAYS_OFF

  # Relais 4
  - platform: gpio
    name: "Warmwasserbereitung Anforderung"
    id: wwb_anforderung
    pin:
      number: GPIO15
      inverted: true
      ignore_strapping_warning: true
    restore_mode: ALWAYS_OFF

    # Update relevant flow sensors
    on_turn_on:
      # Warmwasserbereitung
      - component.update: heizkreis_diff
      - component.update: warmwasser_diff
    on_turn_off:
      # Heizungsmodus
      - component.update: heizkreis_diff
      - component.update: warmwasser_diff

# Pump runtime counters (reset on reboot, HA tracks total via total_increasing)
# https://esphome.io/components/sensor/duty_time.html
sensor:
  - platform: duty_time
    name: "Kesselpufferkreis Umwaelzpumpe Betriebsstunden"
    lambda: return id(switch_kesselpufferkreis_pumpe).state;
    unit_of_measurement: h
    device_class: duration
    state_class: total_increasing
    accuracy_decimals: 2
    update_interval: 60s

  - platform: duty_time
    name: "Solarkreis Umwaelzpumpe Betriebsstunden"
    lambda: return id(switch_solarkreis_pumpe).state;
    unit_of_measurement: h
    device_class: duration
    state_class: total_increasing
    accuracy_decimals: 2
    update_interval: 60s

  - platform: duty_time
    name: "Warmwasser Zirkulationspumpe Betriebsstunden"
    lambda: return id(switch_warmwasser_zirkulation).state;
    unit_of_measurement: h
    device_class: duration
    state_class: total_increasing
    accuracy_decimals: 2
    update_interval: 60s
