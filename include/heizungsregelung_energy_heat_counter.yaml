packages:
  - !include
    file: water_meter_heat_counter_template.yaml
    vars:
      heat_counter_name: "Heizkreis"
      heat_counter_id: "heizkreis"
      heat_counter_gpio: "GPIO34"
      heat_counter_temp_diff: "heizkreis_diff"

  - !include
    file: water_meter_heat_counter_template.yaml
    vars:
      heat_counter_name: "Warmwasser"
      heat_counter_id: "wwb"
      heat_counter_gpio: "GPIO35"
      heat_counter_temp_diff: "warmwasser_diff"

switch:
  - id: !extend wwb_anforderung
    on_turn_on:
      - component.update: sensor_heizkreis_wasser
      - component.update: sensor_heizkreis_energie
      - component.update: sensor_wwb_wasser
      - component.update: sensor_wwb_energie
    on_turn_off:
      - component.update: sensor_heizkreis_wasser
      - component.update: sensor_heizkreis_energie
      - component.update: sensor_wwb_wasser
      - component.update: sensor_wwb_energie