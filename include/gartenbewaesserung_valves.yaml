
# https://esphome.io/components/switch/gpio.html
switch:
  - platform: gpio
    name: Ventil 1
    id: ventil_1
    pin: 25
    restore_mode: ALWAYS_OFF  # Kann nicht geändert werden (Astra Controller Verhalten)
    on_turn_on:
      - select.set:
            id: taster_1_led
            option: green
    on_turn_off:
      - select.set:
            id: taster_1_led
            option: "off"

  - platform: gpio
    name: Ventil 2
    id: ventil_2
    pin: 26
    restore_mode: ALWAYS_OFF
    on_turn_on:
      - select.set:
            id: taster_2_led
            option: green
    on_turn_off:
      - select.set:
            id: taster_2_led
            option: "off"

  - platform: gpio
    name: Ventil 3
    id: ventil_3
    pin: 33
    restore_mode: ALWAYS_OFF
