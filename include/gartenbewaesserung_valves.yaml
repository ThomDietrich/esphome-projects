
# Ventile (Magnetventile, 4x 16A Relais) — bedarfsgerechte Nutzung, KEINE feste Zonenzuordnung.
# Ventil-Taster-LED (Bedeutung "fliesst hier Wasser?"):
#   aus = Ventil zu | gelb = offen, aber Pumpe aus (kein Wasser) | gruen = offen + Pumpe freigegeben (Wasser da)
# Bei jeder Ventil-Aenderung laeuft ventil_leds_aktualisieren (faktoriert den Pumpen-Ist ein) —
# Logik/Skript: include/gartenbewaesserung_pumpe_link.yaml

# https://esphome.io/components/switch/gpio.html
switch:
  - platform: gpio
    name: Ventil 1
    id: ventil_1
    pin: 25
    restore_mode: ALWAYS_OFF  # Kann nicht geändert werden (Astra Controller Verhalten)
    on_turn_on:
      - script.execute: ventil_leds_aktualisieren
    on_turn_off:
      - script.execute: ventil_leds_aktualisieren

  - platform: gpio
    name: Ventil 2
    id: ventil_2
    pin: 26
    restore_mode: ALWAYS_OFF
    on_turn_on:
      - script.execute: ventil_leds_aktualisieren
    on_turn_off:
      - script.execute: ventil_leds_aktualisieren

  - platform: gpio
    name: Ventil 3
    id: ventil_3
    pin: 33
    restore_mode: ALWAYS_OFF
    on_turn_on:
      - script.execute: ventil_leds_aktualisieren
    on_turn_off:
      - script.execute: ventil_leds_aktualisieren

  - platform: gpio
    name: Ventil 4
    id: ventil_4
    pin: 32
    restore_mode: ALWAYS_OFF
    on_turn_on:
      - script.execute: ventil_leds_aktualisieren
    on_turn_off:
      - script.execute: ventil_leds_aktualisieren
