# ======================================================================================================================
# Sicherheitsüberwachung — Fussbodenheizung
# ======================================================================================================================
# Unabhängige Schutzfunktionen, die parallel zum Regler laufen und bei Gefahrenzuständen direkt in die Ventilsteuerung
# eingreifen.
#
# SICHERHEITS-LOCKOUT (persistent, manueller Reset erforderlich):
#   Bei kritischen Zuständen wird ein persistenter Lockout aktiviert, der nur durch manuellen Benutzer-Reset aufgehoben
#   werden kann. Der Lockout:
#     - Stoppt alle Ventil-Skripte (drive_valve_open/close, position_controller)
#     - Schließt das Mischventil zwangsweise (relais_ventil_zu = EIN)
#     - Schaltet die Umwälzpumpe ab
#     - Sendet eine persistente HA-Benachrichtigung
#   Der Lockout überlebt Neustarts (restore_value) und wird alle 10s durchgesetzt, sodass auch nach Reboot der sichere
#   Zustand hergestellt wird.
#
# Lockout-Auslöser:
#
#   Übertemperaturschutz (10s-Intervall):
#     Wenn die FBH-Vorlauftemperatur den Grenzwert max_vorlauf ueberschreitet. Schuetzt den Estrich
#     vor thermischer Ueberlastung (typisch: 50°C).
#
#   Sensorfehler-Watchdog (30s-Intervall, 60s Boot-Karenzzeit):
#     Wenn einer der vier DS18B20-Sensoren ungueltige Werte liefert (kein Messwert, NaN, < 5°C
#     oder > 80°C). Verhindert unkontrolliertes Aufheizen bei Sensorausfall. Die 60s Karenzzeit
#     nach Boot verhindert Fehlausloesung bevor die Sensoren ihre ersten Messwerte liefern. Ventil
#     wird sofort aktiv geschlossen (identisch zu Uebertemperaturschutz).
#
# Untertemperatur-Betriebssperre (separates File):
#
#   Die Untertemperatur-Erkennung (Quellentemperatur zu niedrig zum Heizen) ist in
#   keller_fbh_untertemperatur.yaml ausgelagert, da sie kein sicherheitskritischer Lockout ist,
#   sondern eine automatisch reversible Betriebssperre.
#
# Alle Funktionen arbeiten unabhaengig vom Reglerzustand und vom FBH Hauptschalter. Sie greifen
# direkt auf die Relais zu. Der Lockout wird zusaetzlich vom Positionsregler geprueft
# (keller_fbh_mischventil_steuerung.yaml) und blockiert jede Ventilbewegung.
#
# ======================================================================================================================


# ======================================================================================================================
# Globale Variablen — Sicherheitszustand
# ======================================================================================================================

globals:
  # Sicherheits-Lockout: Bei true ist die Anlage abgeschaltet.
  # Persistent über Neustarts. Nur manueller Reset durch Benutzer.
  - id: safety_lockout
    type: bool
    restore_value: true
    initial_value: "false"


# ======================================================================================================================
# Sicherheits-Intervalle
# ======================================================================================================================

# ======================================================================================================================
# Uebertemperaturschutz — Reaktiv via binary_sensor
# ======================================================================================================================
# Loest Lockout aus wenn die FBH-Vorlauftemperatur laenger als 3s ueber dem Grenzwert liegt.
# Reagiert sofort auf Sensorwerte statt per Polling-Intervall.

binary_sensor:
  - platform: template
    name: "Sekundaer Uebertemperaturschutz"
    id: sekundaer_uebertemperaturschutz
    device_id: mischer
    device_class: heat
    icon: "mdi:thermometer-alert"
    lambda: |-
      // Kein Messwert seit Boot → kein Uebertemperatur-Urteil (verhindert Fehlausloesung)
      if (!id(t_fbh_vl).has_state()) return false;
      return id(t_fbh_vl).state > ${max_vorlauf};
    filters:
      - delayed_on: 3s
    on_press:  # OFF→ON: Temperatur > Grenzwert fuer > 3s
      - lambda: "id(safety_lockout) = true;"
      - script.stop: drive_valve_open
      - script.stop: drive_valve_close
      - script.stop: position_controller
      - switch.turn_off: relais_ventil_auf
      - delay: 500ms
      - switch.turn_on: relais_ventil_zu
      - switch.turn_off: pumpe_fbh
      - component.update: reglerzustand
      - homeassistant.service:
          service: persistent_notification.create
          data:
            title: "FBH Sicherheitsabschaltung"
            notification_id: "fbh_safety"
          data_template:
            message: "Uebertemperaturschutz: FBH-Vorlauf {{ vl }}°C ueberschreitet Grenzwert ${max_vorlauf}°C. Ventil geschlossen, Pumpe abgeschaltet. Manueller Reset erforderlich."
          variables:
            vl: "return id(t_fbh_vl).state;"
      - logger.log:
          level: ERROR
          format: "SICHERHEIT: Uebertemperatur %.1f°C > ${max_vorlauf}°C — LOCKOUT!"
          args: ['id(t_fbh_vl).state']

# ======================================================================================================================
# Lockout-Durchsetzung — Watchdog (10s)
# ======================================================================================================================
# Erzwingt den sicheren Zustand periodisch, falls nach Lockout jemand oder etwas (Reboot,
# manueller Eingriff) Relais oder Pumpe wieder einschaltet.

interval:
  - interval: 10s
    then:
      - if:
          condition:
            lambda: "return id(safety_lockout);"
          then:
            - if:
                condition:
                  or:
                    - switch.is_on: relais_ventil_auf
                    - switch.is_on: pumpe_fbh
                    - switch.is_off: relais_ventil_zu
                then:
                  - switch.turn_off: relais_ventil_auf
                  - delay: 500ms
                  - switch.turn_on: relais_ventil_zu
                  - switch.turn_off: pumpe_fbh
                  - logger.log:
                      level: WARN
                      format: "SICHERHEIT: Lockout aktiv — sicherer Zustand erzwungen"

  # ---- SENSORFEHLER-WATCHDOG (30s) ----
  # Prüft alle vier DS18B20-Sensoren. 60s Boot-Karenzzeit, damit Sensoren
  # ihre ersten Messwerte liefern können, bevor der Watchdog auslöst.
  - interval: 30s
    then:
      - if:
          condition:
            lambda: |-
              if (id(safety_lockout)) return false;
              if (millis() < 60000) return false;
              auto check = [](sensor::Sensor *s) -> bool {
                if (!s->has_state()) return true;
                float t = s->state;
                return isnan(t) || t < 5.0f || t > 80.0f;
              };
              return check(id(t_fbh_vl)) || check(id(t_prim_vl))
                     || check(id(t_prim_rl)) || check(id(t_fbh_rl));
          then:
            - lambda: "id(safety_lockout) = true;"
            - script.stop: drive_valve_open
            - script.stop: drive_valve_close
            - script.stop: position_controller
            - switch.turn_off: relais_ventil_auf
            - delay: 500ms
            - switch.turn_on: relais_ventil_zu
            - switch.turn_off: pumpe_fbh
            - component.update: reglerzustand
            - homeassistant.service:
                service: persistent_notification.create
                data:
                  title: "FBH Sicherheitsabschaltung"
                  notification_id: "fbh_safety"
                  message: "Sensorfehler: Mindestens ein Temperatursensor liefert ungueltige Werte. Ventil und Pumpe abgeschaltet. Manueller Reset erforderlich."
            - logger.log:
                level: ERROR
                format: "SICHERHEIT: Sensorfehler — LOCKOUT aktiviert!"



# ======================================================================================================================
# Manueller Sicherheits-Reset
# ======================================================================================================================
# Setzt den Sicherheits-Lockout zurück. Das System nimmt den Normalbetrieb wieder auf: Der Positionsregler startet im
# nächsten 10s-Zyklus (sofern die Mischkreis-Automatik aktiv ist). Die Umwälzpumpe muss separat eingeschaltet werden,
# da sie bei der Sicherheitsabschaltung explizit abgeschaltet wurde.

button:
  - platform: template
    name: "Sicherheits-Reset"
    id: safety_reset
    device_id: mischer
    icon: "mdi:shield-refresh"
    entity_category: config
    on_press:
      - lambda: "id(safety_lockout) = false;"
      - switch.turn_off: relais_ventil_zu
      - component.update: ventilstellung_ist_sensor
      - component.update: reglerzustand
      - homeassistant.service:
          service: persistent_notification.dismiss
          data:
            notification_id: "fbh_safety"
      - logger.log:
          level: WARN
          format: "SICHERHEIT: Lockout manuell zurueckgesetzt — Normalbetrieb moeglich"
