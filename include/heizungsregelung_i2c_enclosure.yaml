# ============================================================================
# Gehaeuseueberwachung — Temperatur und Luftfeuchte
# ============================================================================
# SHT3x-D Sensor (I2C, Adresse 0x44) im Schaltschrankgehaeuse.
# Ueberwacht Temperatur und Luftfeuchte zur Erkennung von Ueberhitzung
# oder Kondensation im geschlossenen Gehaeuse.
# ============================================================================

# https://esphome.io/components/i2c.html
i2c:
  sda: GPIO22
  scl: GPIO21
  scan: false

# SHT3X-D Temperature+Humidity Sensor
# https://esphome.io/components/sensor/sht3xd.html
sensor:
  - platform: sht3xd
    temperature:
      name: "Gehaeuse Temperatur"
      unit_of_measurement: "°C"
      accuracy_decimals: 1
    humidity:
      name: "Gehaeuse Luftfeuchte"
      unit_of_measurement: "%"
      accuracy_decimals: 1
    address: 0x44
    update_interval: 60s
