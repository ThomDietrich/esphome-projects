# heat_counter_template.yaml
#
# Reusable ESPHome package for a Zenner pulse water meter (0.25 L/pulse)
# with thermal energy calculation (Wärmemengenzähler).
#
# Required substitutions:
#   heat_counter_name        – Human-readable name prefix  (e.g. "Heizkreis")
#   heat_counter_id          – ID-safe slug                 (e.g. "heizkreis")
#   heat_counter_gpio        – GPIO pin for pulse input     (e.g. "GPIO34")
#   heat_counter_temp_diff   – ID of the ΔT sensor          (e.g. "heizkreis_diff")
#
# Usage in your main YAML:
#
#   packages:
#     heizkreis_heat_counter:
#       file: heat_counter_template.yaml
#       vars:
#         heat_counter_name:      "Heizkreis"
#         heat_counter_id:        "heizkreis"
#         heat_counter_gpio:      "GPIO34"
#         heat_counter_temp_diff: "heizkreis_diff"
#
# ID naming convention:
#   All IDs use the prefix "waerme_" to distinguish from electrical
#   sensors (prefix "strom_") in s0_energy_meter_template.yaml.
#
# Zenner Warmwasserzähler Q3 2,5
# https://www.spewa.de/systemtechnik-m-bus-impuls-zaehler/impuls-zaehler-m-bus-zaehler/impulszaehler/einstrahler/wasserzaehler-0-25-liter-impuls/828/zenner-warmwasserzaehler-q3-2-5/3/4-ag/bl-110-mm-mit-impulsausgang-0-25-liter-eichung-2024
#
# Energieverbrauch (Wärmeenergie Q):
#   m_g      = 0.25 L × 990 g/L = 248 g pro Impuls
#   c_wh_kgk = 1.1625 Wh/(kg·K)
#   k_k      = Temperaturdifferenz in Kelvin (from heat_counter_temp_diff sensor)

# ---------------------------------------------------------------------------
# Globals – running totals, lost on reboot (state_class: total_increasing
#           lets Home Assistant handle that correctly)
# ---------------------------------------------------------------------------
globals:
  - id: global_${heat_counter_id}_waerme_volumen_l
    type: float
    restore_value: no
    initial_value: '0.0'

  - id: global_${heat_counter_id}_waerme_energie_kwh
    type: float
    restore_value: no
    initial_value: '0.0'

  # Flow rate calculation — previous snapshot for delta computation
  - id: global_${heat_counter_id}_waerme_prev_vol_l
    type: float
    restore_value: no
    initial_value: '0.0'

  - id: global_${heat_counter_id}_waerme_prev_time_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'

# ---------------------------------------------------------------------------
# Binary sensor – GPIO pulse input from Zenner meter
# ---------------------------------------------------------------------------
binary_sensor:
  - platform: gpio
    name: "${heat_counter_name} Volumenstrommessung Tick Sensor"
    id: intern_${heat_counter_id}_waerme_tick
    pin: ${heat_counter_gpio}
    icon: mdi:square-wave
    internal: true
    entity_category: diagnostic
    filters:
      - delayed_on: 100ms
      - delayed_off: 100ms
    on_release:
      - globals.set:
          id: global_${heat_counter_id}_waerme_volumen_l
          value: !lambda |-
            return id(global_${heat_counter_id}_waerme_volumen_l) + 0.25;
      - if:
          condition:
            lambda: |-
              return !isnan(id(${heat_counter_temp_diff}).state);
          then:
            - globals.set:
                id: global_${heat_counter_id}_waerme_energie_kwh
                value: !lambda |-
                  const int m_g = 248;
                  const float c_wh_kgk = 1.1625;
                  const float k_k = id(${heat_counter_temp_diff}).state;
                  return id(global_${heat_counter_id}_waerme_energie_kwh) + m_g * c_wh_kgk * k_k / 1000.0 / 1000.0;

# ---------------------------------------------------------------------------
# Template sensors – volume (L) and thermal energy (kWh)
# ---------------------------------------------------------------------------
sensor:
  - platform: template
    name: "${heat_counter_name} Volumen"
    id: sensor_${heat_counter_id}_waerme_volumen
    device_id: ${heat_counter_device_id}
    state_class: total_increasing
    device_class: water
    unit_of_measurement: L
    icon: mdi:waves-arrow-right
    accuracy_decimals: 1
    lambda: return id(global_${heat_counter_id}_waerme_volumen_l);
    update_interval: 10s
    filters:
      - or:
        - delta: 0.01
        - heartbeat: 5min

  - platform: template
    name: "${heat_counter_name} Energie"
    id: sensor_${heat_counter_id}_waerme_energie
    device_id: ${heat_counter_device_id}
    state_class: total_increasing
    device_class: energy
    unit_of_measurement: kWh
    icon: mdi:home-lightning-bolt-outline
    accuracy_decimals: 2
    lambda: return id(global_${heat_counter_id}_waerme_energie_kwh);
    update_interval: 10s
    filters:
      - or:
        - delta: 0.01
        - heartbeat: 5min

  # Flow rate — averaged over 60s windows, smoothed with 3-sample sliding window.
  # At typical FBH flow (~5 L/min) one window captures ~20 pulses (±5% quantization).
  # The sliding window reduces this to ~2%. Reports 0 when no flow detected.
  - platform: template
    name: "${heat_counter_name} Durchfluss"
    id: sensor_${heat_counter_id}_waerme_durchfluss
    device_id: ${heat_counter_device_id}
    unit_of_measurement: "L/min"
    icon: mdi:water-pump
    accuracy_decimals: 1
    update_interval: 60s
    lambda: |-
      uint32_t now = millis();
      uint32_t prev = id(global_${heat_counter_id}_waerme_prev_time_ms);
      if (prev == 0) {
        // First call after boot — seed snapshot, skip this cycle
        id(global_${heat_counter_id}_waerme_prev_vol_l) = id(global_${heat_counter_id}_waerme_volumen_l);
        id(global_${heat_counter_id}_waerme_prev_time_ms) = now;
        return {};
      }
      uint32_t dt_ms = now - prev;
      if (dt_ms < 1000) return {};
      float dv = id(global_${heat_counter_id}_waerme_volumen_l) - id(global_${heat_counter_id}_waerme_prev_vol_l);
      id(global_${heat_counter_id}_waerme_prev_vol_l) = id(global_${heat_counter_id}_waerme_volumen_l);
      id(global_${heat_counter_id}_waerme_prev_time_ms) = now;
      return dv / (dt_ms / 60000.0f);
    filters:
      - sliding_window_moving_average:
          window_size: 3
          send_every: 1

  # Thermal power — derived from flow rate and temperature spread.
  # P = flow [L/min] / 60 × ρ [kg/L] × c_p [kJ/(kg·K)] × ΔT [K]
  # With ρ ≈ 0.99 kg/L and c_p ≈ 4.182 kJ/(kg·K) at ~35°C.
  - platform: template
    name: "${heat_counter_name} Leistung"
    id: sensor_${heat_counter_id}_waerme_leistung
    device_id: ${heat_counter_device_id}
    unit_of_measurement: "kW"
    device_class: power
    icon: mdi:heat-wave
    accuracy_decimals: 2
    update_interval: 60s
    lambda: |-
      if (!id(sensor_${heat_counter_id}_waerme_durchfluss).has_state()) return {};
      if (isnan(id(${heat_counter_temp_diff}).state)) return {};
      float flow_l_min = id(sensor_${heat_counter_id}_waerme_durchfluss).state;
      float dt_k = id(${heat_counter_temp_diff}).state;
      return (flow_l_min / 60.0f) * 0.99f * 4.182f * dt_k;
    filters:
      - sliding_window_moving_average:
          window_size: 3
          send_every: 1
