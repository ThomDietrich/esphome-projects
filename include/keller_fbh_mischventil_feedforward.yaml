# ======================================================================================================================
# Störgrößenaufschaltung (Feedforward) — Mischventilregelung
# ======================================================================================================================
#
# Berechnet die physikalisch korrekte Ventilöffnung aus der Mischungsgleichung.
# Die Kombination mit dem PID-Regler erfolgt in keller_fbh_mischventil_steuerung.yaml.
#
#
# MISCHUNGSGLEICHUNG
# ======================================================================================================================
#
#   V_ff = (T_Soll − T_Rücklauf) / (T_Primär − T_Rücklauf)
#
# Beispiel:  T_Soll=25°C, T_RL=22°C
#            T_Prim=32°C → V_ff = 3/10  = 30%
#            T_Prim=48°C → V_ff = 3/26  = 11.5%    (Ventil schließt sofort beim Brennerstart)
#
#
# PRIMÄRTEMPERATUR-QUELLE
# ======================================================================================================================
#
# Lokaler DS18B20-Sensor t_prim_vl direkt vor dem Mischer. Misst die tatsächliche Temperatur
# am Mischpunkt — entscheidend für die Genauigkeit der Mischungsgleichung.
#
# Frühere Variante nutzte sensor.heizungsregelung_gastherme_vorlauf (HA), aber:
#   - Gastherme VL ist 15–20 K höher als Prim VL (Wärmeverluste in der Leitung)
#   - FF unterschätzt dadurch systematisch die nötige Ventilöffnung
#   - Gastherme VL reagiert sofort auf Brennerzyklen, obwohl die Hitze erst verzögert am
#     Mischer ankommt — verursacht unnötige FF-Schwankungen
# Prim VL löst beide Probleme: korrekte Temperatur und natürliche Glättung durch Rohrleitung.
#
#
# VENTILKENNLINIE
# ======================================================================================================================
#
# Der Oventrop Regumat Dreiwegemischer (DN 25, kvs 5.5 m³/h) hat eine **lineare**
# Temperaturkennlinie: Mischtemperatur verhält sich proportional zum Drehwinkel (0–90°).
# Die Mischungsgleichung V_ff = (T_Soll − T_RL) / (T_Prim − T_RL) ist damit physikalisch
# korrekt und benötigt keine Kennlinien-Korrektur (γ-Exponent o.ä.).
#
# Verbleibende Abweichungen zwischen FF-Modell und Realität entstehen durch hydraulische
# Effekte (Pumpenkennlinie, Rohrwiderstände), nicht durch die Ventilcharakteristik.
#
#
# EINSCHRÄNKUNGEN
# ======================================================================================================================
#
#   - T_Rücklauf ist kurzfristig stabil (thermische Trägheit Estrich), langfristig variabel
#   - Bei T_Primär ≈ T_Rücklauf (Differenz < 2K): FF nicht berechenbar → automatischer Fallback auf PID
#   - Sensorausfälle werden unverändert durch keller_fbh_sicherheit.yaml erkannt
#
# ======================================================================================================================


# ======================================================================================================================
# Globale Variablen — Feedforward
# ======================================================================================================================

globals:
  # Feedforward-Ventilöffnung aus Mischungsgleichung (0.0–1.0)
  - id: feedforward_position
    type: float
    restore_value: false
    initial_value: "0.5"

  # Feedforward-Anteil an der Soll-Öffnung (0.0–1.0, Standard 0.6 = 60%)
  - id: ff_anteil_wert
    type: float
    restore_value: true
    initial_value: "0.6"


# ======================================================================================================================
# Feedforward-Neuberechnung
# ======================================================================================================================
# Wird aufgerufen bei: Temperaturänderung (t_prim_vl, t_fbh_rl) und periodisch (60s).
# Nach Aktualisierung von feedforward_position wird recalculate_valve_target
# (keller_fbh_mischventil_steuerung.yaml) aufgerufen, um die Kombination mit PID
# und die Soll-Öffnung zu aktualisieren.

script:
  - id: recalculate_feedforward
    mode: single
    then:
      - lambda: |-
          if (!id(t_prim_vl).has_state() || !id(t_fbh_rl).has_state()) return;
          float t_prim = id(t_prim_vl).state;
          float t_soll = id(pid_mischkreis).target_temperature;
          float t_rl = id(t_fbh_rl).state;
          float denom = t_prim - t_rl;
          if (denom > 2.0f) {
            float ff = (t_soll - t_rl) / denom;
            id(feedforward_position) = std::max(0.0f, std::min(1.0f, ff));
          }
      - component.update: feedforward_sensor
      - script.execute: recalculate_valve_target

interval:
  - interval: 60s
    then:
      - script.execute: recalculate_feedforward


sensor:
  # Feedforward-Stellgröße aus der Mischungsgleichung (ohne PID-Anteil)
  - platform: template
    name: "Feedforward Stellgroesse"
    id: feedforward_sensor
    device_id: mischer
    unit_of_measurement: "%"
    accuracy_decimals: 0
    icon: "mdi:calculator-variant"
    entity_category: diagnostic
    update_interval: never
    lambda: |-
      return id(feedforward_position) * 100.0;


# ======================================================================================================================
# FF-Anteil — über Home Assistant einstellbar
# ======================================================================================================================

number:
  - platform: template
    name: "Feedforward Anteil"
    id: ff_anteil_nr
    device_id: mischer
    icon: "mdi:tune-vertical"
    entity_category: config
    unit_of_measurement: "%"
    min_value: 0
    max_value: 100
    step: 5
    mode: box
    initial_value: 70
    restore_value: true
    optimistic: true
    set_action:
      - lambda: |-
          id(ff_anteil_wert) = x / 100.0f;
      - script.execute: recalculate_valve_target
