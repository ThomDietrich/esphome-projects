# ============================================================================
# DS18B20 Temperatursensoren — 1-Wire Bus 1 (GPIO32)
# ============================================================================
# 15 DS18B20-Sensoren auf einem gemeinsamen 1-Wire-Bus erfassen die
# Temperaturen an allen relevanten Punkten der Heizungsanlage:
#
# Solarkreis:
#   - Solarkreis Vorlauf:  zum Solarthermiefeld (kalt hoch)
#   - Solarkreis Ruecklauf:  vom Solarthermiefeld (warm zurueck)
#
# Warmwasserspeicher:
#   - Warmwasserspeicher unten / oben:  Schichtladung
#   - Warmwasserspeicher Abfluss:  Entnahmetemperatur
#
# Heizkreis (Gastherme → Heizkoerper):
#   - Heizkreis Vorlauf / Ruecklauf
#   - Gastherme Vorlauf / Ruecklauf Warmwasserbereitung
#
# Kessel und Puffer:
#   - Kessel Vorlauf / Ruecklauf
#   - Kesselpufferkreis Vorlauf / Ruecklauf
#   - Pufferspeicher blau 550L / grau 600L:  je ein Einzelsensor
#
# Alle Sensoren: 15s Update, filter_out 85°C (Reset-Wert), Delta 0.3°C,
# Heartbeat 30min. Relevante Sensoren triggern Differenzberechnungen.
# ============================================================================

one_wire:
  - platform: gpio
    id: one_wire_gpio32
    pin: GPIO32

sensor:

  - <<: !include ds18b20_template.yaml
    one_wire_id: one_wire_gpio32
    address: 0xaa041684630cff28
    name: Solarkreis Vorlauf # zum Solarthermiefeld
    id: solarkreis_vl
    icon: mdi:thermometer-chevron-down
    on_value:
      - component.update: solarkreis_diff_rlvl

  - <<: !include ds18b20_template.yaml
    one_wire_id: one_wire_gpio32
    address: 0xd33c97f6491fd728
    name: Solarkreis Ruecklauf # vom Solarthermiefeld
    id: solarkreis_rl
    icon: mdi:thermometer-chevron-up
    on_value:
      - component.update: solarkreis_diff_rlvl

  - <<: !include ds18b20_template.yaml
    one_wire_id: one_wire_gpio32
    address: 0x540316839e33ff28
    name: Warmwasserspeicher unten
    id: warmwasserspeicher_unten
    on_value:
      - component.update: solarkreis_diff_ou

  - <<: !include ds18b20_template.yaml
    one_wire_id: one_wire_gpio32
    address: 0xa25469481f64ff28
    name: Warmwasserspeicher oben
    id: warmwasserspeicher_oben

  - <<: !include ds18b20_template.yaml
    one_wire_id: one_wire_gpio32
    address: 0x2500000cf8822e28
    name: Heizkreis Vorlauf
    id: heizkreis_vl
    icon: mdi:thermometer-chevron-up
    on_value:
      - component.update: heizkreis_diff

  - <<: !include ds18b20_template.yaml
    one_wire_id: one_wire_gpio32
    address: 0x94626a481f64ff28
    name: Heizkreis Ruecklauf
    id: heizkreis_rl
    on_value:
      - component.update: heizkreis_diff

  - <<: !include ds18b20_template.yaml
    one_wire_id: one_wire_gpio32
    address: 0x4400000cf8ea0528
    name: Gastherme Vorlauf
    id: gastherme_vl
    on_value:
      - component.update: warmwasser_diff

  - <<: !include ds18b20_template.yaml
    one_wire_id: one_wire_gpio32
    address: 0x9500000cf8984828
    name: Gastherme Ruecklauf Warmwasserbereitung
    id: gastherme_rl_wwb
    on_value:
      - component.update: warmwasser_diff

  - <<: !include ds18b20_template.yaml
    one_wire_id: one_wire_gpio32
    address: 0x45000005fa787a28
    name: Pufferspeicher blau 550 Liter

  - <<: !include ds18b20_template.yaml
    one_wire_id: one_wire_gpio32
    address: 0xd6000005faf54928
    name: Pufferspeicher grau 600 Liter

  - <<: !include ds18b20_template.yaml
    one_wire_id: one_wire_gpio32
    address: 0xc400000cf8624528
    name: Kessel Vorlauf
    id: kessel_vl
    on_value:
      - component.update: kessel_diff

  - <<: !include ds18b20_template.yaml
    one_wire_id: one_wire_gpio32
    address: 0xd900000cf8d4ca28
    name: Kessel Ruecklauf
    id: kessel_rl
    on_value:
      - component.update: kessel_diff

  - <<: !include ds18b20_template.yaml
    one_wire_id: one_wire_gpio32
    address: 0x0ebe6d481f64ff28
    name: Kesselpufferkreis Vorlauf
    id: kesselpufferkreis_vl
    on_value:
      - component.update: kesselpufferkreis_diff

  - <<: !include ds18b20_template.yaml
    one_wire_id: one_wire_gpio32
    address: 0xe73f69481f64ff28
    name: Kesselpufferkreis Ruecklauf
    id: kesselpufferkreis_rl
    on_value:
      - component.update: kesselpufferkreis_diff

  - <<: !include ds18b20_template.yaml
    one_wire_id: one_wire_gpio32
    address: 0x7c186d481f64ff28
    name: Warmwasserspeicher Abfluss
