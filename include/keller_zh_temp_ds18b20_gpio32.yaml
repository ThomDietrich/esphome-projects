# ======================================================================================================================
# DS18B20 Temperatursensoren — 1-Wire Bus 1 (GPIO32)
# ======================================================================================================================
# 15 DS18B20-Sensoren auf einem gemeinsamen 1-Wire-Bus erfassen die Temperaturen an allen relevanten Punkten der
# Heizungsanlage:
#
# Solarthermie:
#   - Vorlauftemperatur:  zum Solarthermiefeld (kalt hoch)
#   - Ruecklauftemperatur:  vom Solarthermiefeld (warm zurueck)
#
# Warmwasserspeicher:
#   - Temperatur unten / oben:  Schichtladung
#   - Entnahmetemperatur:  Zapftemperatur am Warmwasserausgang
#
# Heizkreis:
#   - Vorlauftemperatur / Ruecklauftemperatur
#
# Warmwasserspeicher (Gastherme-seitig):
#   - Gastherme Vorlauftemperatur / Ruecklauftemperatur
#
# Kessel und Puffer:
#   - Vorlauftemperatur / Ruecklauftemperatur (am Kessel)
#   - Pufferkreis Vorlauftemperatur / Ruecklauftemperatur
#   - Pufferspeicher blau (Buderus Logalux SF551, 550L) / grau (EPS 600, 600L):  je ein Einzelsensor
#     TODO: Position der Einzelsensoren (oben/mitte/unten)?
#
# Alle Sensoren: 15s Update, filter_out 85°C (Reset-Wert), Delta 0.3°C, Heartbeat 30min. Relevante Sensoren triggern
# Differenzberechnungen.
# ======================================================================================================================

one_wire:
  - platform: gpio
    id: one_wire_gpio32
    pin: GPIO32

sensor:

  - <<: !include ds18b20_template.yaml
    one_wire_id: one_wire_gpio32
    address: 0xaa041684630cff28
    name: Vorlauftemperatur # zum Solarthermiefeld
    id: solarkreis_vl
    device_id: solarthermie
    icon: mdi:thermometer-chevron-down
    on_value:
      - component.update: solarkreis_diff_rlvl

  - <<: !include ds18b20_template.yaml
    one_wire_id: one_wire_gpio32
    address: 0xd33c97f6491fd728
    name: Ruecklauftemperatur # vom Solarthermiefeld
    id: solarkreis_rl
    device_id: solarthermie
    icon: mdi:thermometer-chevron-up
    on_value:
      - component.update: solarkreis_diff_rlvl

  - <<: !include ds18b20_template.yaml
    one_wire_id: one_wire_gpio32
    address: 0x540316839e33ff28
    name: Temperatur unten
    id: warmwasserspeicher_unten
    device_id: warmwasserspeicher
    on_value:
      - component.update: solarkreis_diff_ou

  - <<: !include ds18b20_template.yaml
    one_wire_id: one_wire_gpio32
    address: 0xa25469481f64ff28
    name: Temperatur oben
    id: warmwasserspeicher_oben
    device_id: warmwasserspeicher

  - <<: !include ds18b20_template.yaml
    one_wire_id: one_wire_gpio32
    address: 0x2500000cf8822e28
    name: Vorlauftemperatur
    id: heizkreis_vl
    device_id: heizkreis
    icon: mdi:thermometer-chevron-up
    on_value:
      - component.update: heizkreis_diff

  - <<: !include ds18b20_template.yaml
    one_wire_id: one_wire_gpio32
    address: 0x94626a481f64ff28
    name: Ruecklauftemperatur
    id: heizkreis_rl
    device_id: heizkreis
    on_value:
      - component.update: heizkreis_diff

  - <<: !include ds18b20_template.yaml
    one_wire_id: one_wire_gpio32
    address: 0x4400000cf8ea0528
    name: Vorlauftemperatur
    id: gastherme_vl
    device_id: gastherme
    on_value:
      - component.update: warmwasser_diff

  - <<: !include ds18b20_template.yaml
    one_wire_id: one_wire_gpio32
    address: 0x9500000cf8984828
    name: Ruecklauftemperatur
    id: gastherme_rl_wwb
    device_id: gastherme
    on_value:
      - component.update: warmwasser_diff

  - <<: !include ds18b20_template.yaml
    one_wire_id: one_wire_gpio32
    address: 0x45000005fa787a28
    name: Blau Temperatur
    device_id: pufferspeicher

  - <<: !include ds18b20_template.yaml
    one_wire_id: one_wire_gpio32
    address: 0xd6000005faf54928
    name: Grau Temperatur
    device_id: pufferspeicher

  - <<: !include ds18b20_template.yaml
    one_wire_id: one_wire_gpio32
    address: 0xc400000cf8624528
    name: Vorlauftemperatur
    id: kessel_vl
    device_id: kessel
    on_value:
      - component.update: kessel_diff

  - <<: !include ds18b20_template.yaml
    one_wire_id: one_wire_gpio32
    address: 0xd900000cf8d4ca28
    name: Ruecklauftemperatur
    id: kessel_rl
    device_id: kessel
    on_value:
      - component.update: kessel_diff

  - <<: !include ds18b20_template.yaml
    one_wire_id: one_wire_gpio32
    address: 0x0ebe6d481f64ff28
    name: Pufferkreis Vorlauftemperatur
    id: kesselpufferkreis_vl
    device_id: kessel
    on_value:
      - component.update: kesselpufferkreis_diff

  - <<: !include ds18b20_template.yaml
    one_wire_id: one_wire_gpio32
    address: 0xe73f69481f64ff28
    name: Pufferkreis Ruecklauftemperatur
    id: kesselpufferkreis_rl
    device_id: kessel
    on_value:
      - component.update: kesselpufferkreis_diff

  - <<: !include ds18b20_template.yaml
    one_wire_id: one_wire_gpio32
    address: 0x7c186d481f64ff28
    name: Entnahmetemperatur
    device_id: warmwasserspeicher
