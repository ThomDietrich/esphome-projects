# ======================================================================================================================
# Vorlauftemperatur-Regelung — Feedforward + PID
# ======================================================================================================================
#
# Regelt die FBH-Vorlauftemperatur über das Dreiwege-Mischventil (Oventrop Regumat).
# Kombination aus Störgrößenaufschaltung (Feedforward) und PID-Feinkorrektur.
#
#   Regelgröße:    FBH-Vorlauftemperatur T_FBH_VL (DS18B20, 5s Abtastrate)
#   Führungsgröße: Vorlauf-Solltemperatur (einstellbar über HA Climate-Entity)
#   Stellgröße:    Ventilöffnung 0.0–1.0 (0% = Bypass/kalt, 100% = Primär/heiss)
#   Störgrößen:    Primär-Vorlauftemperatur (dominant, schwankt durch Brennerzyklen 32–48°C)
#                  FBH-Rücklauftemperatur (untergeordnet, ändert sich langsam durch Raumlast/Estrichträgheit)
#
#
# 1. ARCHITEKTUR — REGELUNGSKASKADE
# ======================================================================================================================
#
#   ┌──────────────────────────────────────────────────────────────────────────┐
#   │  Feedforward (Mischungsgleichung)                         → V_ff         │
#   │    V_ff = (T_Soll - T_RL) / (T_Prim - T_RL)                              │
#   │    Reagiert sofort auf Primärtemperatur-Änderungen                       │
#   ├──────────────────────────────────────────────────────────────────────────┤
#   │  PID-Regler (ESPHome climate.pid)                         → V_pid        │
#   │    Korrigiert Modellungenauigkeiten und Restfehler                       │
#   ├──────────────────────────────────────────────────────────────────────────┤
#   │  Mischung (pid_output_position)                                          │
#   │    V_soll = α × V_ff + (1 − α) × V_pid                                   │
#   │    α = FF_Anteil (Standard 70%, über HA einstellbar)                     │
#   ├──────────────────────────────────────────────────────────────────────────┤
#   │  Positionsregler (keller_fbh_mischventil.yaml)            Stufe 2        │
#   │    Vergleicht V_soll mit geschätzter Ist-Öffnung                         │
#   │    Erzeugt diskrete Relaisimpulse für 3-Punkt-Stellantrieb               │
#   │    Takt: 10s, max. 15s Impuls (~10% Hub pro Zyklus)                      │
#   └──────────────────────────────────────────────────────────────────────────┘
#
#   Manueller Override (keller_fbh_mischventil.yaml) umgeht die gesamte Kaskade und setzt die
#   Soll-Öffnung direkt.
#
#
# 2. FEEDFORWARD — STÖRGRÖSSENAUFSCHALTUNG
# ======================================================================================================================
#
# Problem: Die Primär-Vorlauftemperatur schwankt durch Brennerzyklen um 15+ K. Ein reiner PID reagiert
# erst wenn die Störung den Sekundär-Vorlauf erreicht — zu spät für schnelle Kompensation.
#
# Lösung: Die Mischungsgleichung berechnet die physikalisch korrekte Ventilöffnung direkt:
#
#   V_ff = (T_Soll − T_Rücklauf) / (T_Primär − T_Rücklauf)
#
# Beispiel:  T_Soll=25°C, T_RL=22°C
#            T_Prim=32°C → V_ff = 3/10  = 30%
#            T_Prim=48°C → V_ff = 3/26  = 11.5%    (Ventil schließt sofort beim Brennerstart)
#
# Kombination mit PID:
#   V_soll = α × V_ff + (1 − α) × V_pid
#
#   α = FF_Anteil (0–100%, Standard 70%):
#     0%   = reiner PID, kein Feedforward (Verhalten wie vor der Erweiterung)
#     70%  = Feedforward dominiert, PID korrigiert Restfehler (empfohlen)
#     100% = reines Feedforward, keine PID-Korrektur
#
# Einschränkungen:
#   - Setzt ideale Durchmischung voraus — reale Ventilkennlinien sind nichtlinear
#   - T_Rücklauf ist kurzfristig stabil (thermische Trägheit Estrich), langfristig variabel
#   - Bei T_Primär ≈ T_Rücklauf (Differenz < 2K): FF nicht berechenbar → automatischer Fallback auf PID
#   - Sensorausfälle werden unverändert durch keller_fbh_sicherheit.yaml erkannt
#
#
# 3. PID-REGLER — FEINKORREKTUR
# ======================================================================================================================
#
# Der PID-Regler berechnet die Stellgröße u(t) aus dem Regelfehler e(t) = Sollwert − Istwert:
#
#   u(t) = Kp · e(t) + Ki · ∫e(t)dt + Kd · de(t)/dt
#
#   P (proportional):   Sofortige Reaktion auf Fehler. Kp × Fehler = Stellgrößenänderung.
#   I (integral):       Summiert Fehler über Zeit → eliminiert bleibende Abweichung.
#                       Kann bei langem Fehler dominieren (Integral Windup).
#   D (differentiell):  Reagiert auf Fehler-Änderungsrate → dämpft Überschwinger.
#                       Aktuell deaktiviert (Kd=0) wegen DS18B20-Rauschen (±0.5°C).
#
# Aktuelle Parameter (Tuning-Historie siehe Abschnitt 8):
#   Kp = ${pid_kp}   Proportionalverstärkung
#   Ki = ${pid_ki}   Integralverstärkung
#   Kd = ${pid_kd}   Differentialverstärkung
#   output_averaging_samples: 5       Glättung über 5 Zyklen (25s)
#   derivative_averaging_samples: 8   Glättung D-Anteil über 8 Zyklen (40s)
#
#
# 4. TOTZONE (DEADBAND)
# ======================================================================================================================
#
# ±0,5 K um den Sollwert. Reduziert Ventilbewegungen im eingeschwungenen Zustand:
#   kp_multiplier: 0.0   P deaktiviert — keine Reaktion auf Kleinstfehler
#   ki_multiplier: 0.05  I auf 5% — nur langsame Drift-Kompensation
#   kd_multiplier: 0.0   D deaktiviert
#   deadband_output_averaging_samples: 15   zusätzliche Glättung
# Zweck: Verschleißminimierung am Stellantrieb.
#
#
# 5. ANTI-WINDUP UND KALTSTARTSCHUTZ
# ======================================================================================================================
#
# Integral Windup: I-Anteil akkumuliert bei saturierter Stellgröße → Überschwingen nach Erreichen des Sollwerts.
#
# Gegenmaßnahmen:
#   1. Integral Clamping (max_integral: 0.8)
#      I-Anteil maximal 80% der Stellgröße. Rest bleibt für P-Anteil.
#
#   2. Integral Reset beim Einschalten (keller_fbh_betrieb.yaml)
#      climate.pid.reset_integral_term bei Automatik-Aktivierung → kein aufgelaufener I-Anteil.
#
#   3. Maximale Schrittweite (MAX_IMPULS_MS=15s in keller_fbh_mischventil.yaml)
#      Ventil bewegt max. 10% Hub pro 10s-Zyklus → erzwingt Neubewertung bei großen Sprüngen.
#
#   4. Deadband mit reduziertem Ki (siehe Abschnitt 4)
#      I-Anteil auf 5% nahe Sollwert → keine unnötige Akkumulation.
#
#
# 6. AUTOTUNING
# ======================================================================================================================
#
# Button „PID Autotuning" startet ESPHome PID-Autotuning (Relay-Methode → Ziegler-Nichols).
# Erzwingt kontrollierte Schwingungen, berechnet optimale Kp/Ki/Kd.
# Voraussetzung: System nahe Sollwert, stabile Primärtemperatur, keine Sollwertänderungen.
# Dauer: 1–3 Stunden je nach Systemträgheit.
# ACHTUNG: Neue Parameter werden nur im RAM gehalten — nach Ermittlung in YAML eintragen und flashen.
#
#
# 7. DIAGNOSESENSOREN
# ======================================================================================================================
#
# PID:         P-Anteil, I-Anteil, D-Anteil, Regelfehler, Stellgröße
# Feedforward: Ventilstellung (FF-Berechnung ohne PID-Anteil, entity_category: diagnostic)
# Alle Sensoren dienen der Regelungsdiagnose und dem Feintuning.
#
#
# 8. TUNING-HISTORIE
# ======================================================================================================================
#
# Randbedingungen: Primär-Vorlauf ~32–48°C (Brennerzyklen), Sollwert 23–25°C,
# Stellantrieb 140s Laufzeit, DS18B20 5s, Positionsregler 10s, MAX_IMPULS_MS=15s.
#
# Schritt 1 (2026-03-26): Kp=0.6, Ki=0.0015, Kd=0 (Startwerte)
#   Beobachtung: Dauerschwingung ±3 K, Periode ~10 min, Stellgröße in Sättigung (Bang-Bang 0–80%).
#   Diagnose: Kp zu hoch — Grenzzyklus bei Ku≈0.6, Tu≈10 min.
#   → Ziegler-Nichols PI: Kp=0.27, Ki=0.0005. Gewählt: Kp=0.2 (konservativer wegen Totzeit).
#
# Schritt 2 (2026-03-26): Kp=0.2, Ki=0.0005, Kd=0
#   Beobachtung: Schwingung ±1.5–2 K, Periode ~40 min, Ventil 0–40% (proportional). +4.5 K Überschwingen
#   nach Sollwert-Sprung, klingt über 2h nicht ab.
#   Diagnose: Arbeitspunkt bei ~10–15%, 40% zu viel. Totzeit verstärkt Überschwingen.
#   → Kp halbiert: Kp=0.1, Ki=0.0003.
#
# Schritt 3 (2026-03-27): Kp=0.1, Ki=0.0003, Kd=0
#   Beobachtung: +5 K Überschwingen beim Einschwingen, danach stabil ±1 K. Ventil 5–10%,
#   PID im Deadband. Kompensiert Brennerzyklen (32–48°C Primär) mit ±200% Regelfehler
#   ohne Sättigung.
#   Diagnose: Parameter stabil für Betriebspunkt (Primär ~40°C, Soll 25°C).
#   → Beibehalten. Feedforward-Erweiterung für bessere Störkompensation.
#
# Nächste Schritte bei weiterem Tuning-Bedarf:
#   - Schwingung analysieren: Amplitude, Periode, Dämpfung über 1–2h
#   - Kp schrittweise halbieren bis gedämpftes Abklingen
#   - Ki nachziehen: Ki ≈ Kp / (Periode_s × 0.5)
#   - Autotuning erst bei stabiler Grundregelung sinnvoll
#   - Bei anderen Randbedingungen (Primärtemperatur, Sollwert) ggf. Nachtuning
#
# ======================================================================================================================


# ======================================================================================================================
# Globale Variablen — PID-Soll-Öffnung
# ======================================================================================================================

globals:
  # Gewünschte Ventilöffnung — Ergebnis aus FF+PID-Mischung (0.0–1.0)
  - id: desired_valve_position
    type: float
    restore_value: false
    initial_value: "0.5"

  # Feedforward-Ventilöffnung aus Mischungsgleichung (0.0–1.0)
  - id: feedforward_position
    type: float
    restore_value: false
    initial_value: "0.5"

  # Feedforward-Anteil an der Soll-Öffnung (0.0–1.0, Standard 0.7 = 70%)
  - id: ff_anteil_wert
    type: float
    restore_value: true
    initial_value: "0.7"


# ======================================================================================================================
# Template-Output — Schnittstelle zwischen PID und Positionsregler
# ======================================================================================================================
# Die PID climate-Komponente schreibt ihre Stellgröße auf diesen Output. Der eigentliche Stellantrieb wird NICHT direkt
# vom PID angesteuert, sondern vom Positionsregler in keller_fbh_mischventil.yaml.

output:
  - platform: template
    id: pid_output_position
    type: float
    write_action:
      - lambda: |-
          float pid_out = state;

          // Feedforward aus Mischungsgleichung: V = (T_Soll - T_RL) / (T_Prim - T_RL)
          float ff = pid_out;  // Fallback: reiner PID wenn FF nicht berechenbar
          if (id(t_prim_vl).has_state() && id(t_fbh_rl).has_state()) {
            float t_soll = id(pid_mischkreis).target_temperature;
            float t_prim = id(t_prim_vl).state;
            float t_rl = id(t_fbh_rl).state;
            float denom = t_prim - t_rl;
            if (denom > 2.0f) {
              ff = (t_soll - t_rl) / denom;
              ff = std::max(0.0f, std::min(1.0f, ff));
            }
          }
          id(feedforward_position) = ff;

          // Gewichtete Mischung: FF liefert Basis, PID korrigiert Restfehler
          float alpha = id(ff_anteil_wert);
          id(desired_valve_position) = std::max(0.0f, std::min(1.0f,
            alpha * ff + (1.0f - alpha) * pid_out));
      - component.update: ventilstellung_soll_sensor
      - component.update: feedforward_sensor


# ======================================================================================================================
# PID Climate — Vorlauftemperatur-Regelung
# ======================================================================================================================

climate:
  - platform: pid
    id: pid_mischkreis
    name: "Vorlaufregelung"
    device_id: mischer
    sensor: t_fbh_vl
    default_target_temperature: ${sollwert_vorlauf}
    heat_output: pid_output_position
    visual:
      min_temperature: 20
      max_temperature: 50
      temperature_step: 0.5
    control_parameters:
      kp: ${pid_kp}
      ki: ${pid_ki}
      kd: ${pid_kd}
      max_integral: 0.8
      output_averaging_samples: 5
      derivative_averaging_samples: 8
    on_control:
      then:
        - component.update: t_prim_headroom
        - component.update: reglerzustand
    deadband_parameters:
      threshold_high: 0.5
      threshold_low: -0.5
      kp_multiplier: 0.0
      ki_multiplier: 0.05
      kd_multiplier: 0.0
      deadband_output_averaging_samples: 15


# ======================================================================================================================
# PID-Diagnosesensoren
# ======================================================================================================================

sensor:
  - platform: pid
    climate_id: pid_mischkreis
    name: "PID P-Anteil"
    device_id: mischer
    type: PROPORTIONAL

  - platform: pid
    climate_id: pid_mischkreis
    name: "PID I-Anteil"
    device_id: mischer
    type: INTEGRAL

  - platform: pid
    climate_id: pid_mischkreis
    name: "PID D-Anteil"
    device_id: mischer
    type: DERIVATIVE

  - platform: pid
    climate_id: pid_mischkreis
    name: "PID Regelfehler"
    device_id: mischer
    type: ERROR

  - platform: pid
    climate_id: pid_mischkreis
    name: "PID Stellgroesse"
    device_id: mischer
    type: HEAT
    unit_of_measurement: "%"

  # Feedforward-Ventilöffnung aus der Mischungsgleichung (ohne PID-Anteil)
  - platform: template
    name: "Feedforward Ventilstellung"
    id: feedforward_sensor
    device_id: mischer
    unit_of_measurement: "%"
    accuracy_decimals: 0
    icon: "mdi:calculator-variant"
    entity_category: diagnostic
    update_interval: never
    lambda: |-
      return id(feedforward_position) * 100.0;


# ======================================================================================================================
# Taste — PID-Autotuning
# ======================================================================================================================

number:
  - platform: template
    name: "Feedforward Anteil"
    id: ff_anteil_nr
    device_id: mischer
    icon: "mdi:tune-vertical"
    entity_category: config
    unit_of_measurement: "%"
    min_value: 0
    max_value: 100
    step: 5
    initial_value: 70
    restore_value: true
    optimistic: true
    set_action:
      - lambda: |-
          id(ff_anteil_wert) = x / 100.0f;


button:
  - platform: template
    name: "PID Autotuning"
    device_id: mischer
    icon: "mdi:tune"
    entity_category: config
    on_press:
      - climate.pid.autotune:
          id: pid_mischkreis
          noiseband: 0.5
          positive_output: 1.0
          negative_output: 0.0
