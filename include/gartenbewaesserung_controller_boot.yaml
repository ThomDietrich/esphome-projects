esphome:
  on_boot:
    - priority: 600
      then:
        - select.set:
            id: taster_0_led
            option: red
    - priority: 250
      then:
        - select.set:
            id: taster_1_led
            option: orange
    - priority: 200
      then:
        - select.set:
            id: taster_2_led
            option: orange
    - priority: 0
      then:
        - select.set:
            id: taster_3_led
            option: orange
    - priority: -100
      then:
        - delay: 500ms
        - select.set:
            id: taster_0_led
            option: green
        - select.set:
            id: taster_1_led
            option: green
        - select.set:
            id: taster_2_led
            option: green
        - select.set:
            id: taster_3_led
            option: green
        - select.set:
            id: taster_4_led
            option: green
        - delay: 3000ms
        - select.set:
            id: taster_0_led
            option: "off"
        - select.set:
            id: taster_1_led
            option: "off"
        - select.set:
            id: taster_2_led
            option: "off"
        - select.set:
            id: taster_3_led
            option: "off"
        - select.set:
            id: taster_4_led
            option: "off"
